# ==============================================================================
# PostgreSQL 14 StatefulSet (Phase 0)
# ==============================================================================
# - replicas 1 (PoC, HA 없음)
# - PVC 50Gi, local-path StorageClass
# - Service: ClusterIP, 클러스터 내부만 접근
# - 스키마는 별도 Job (20-postgres-schema-job.yaml)에서 적용
#   → 이유: schema.sql은 자주 변경될 수 있고, initdb는 첫 부팅 시 1회만 실행됨
# - 노드 배치: k8s-worker3 (RAM 19Gi로 가장 많아 PG 캐시에 유리)
#   PVC는 local-path → /mnt/data/local-path-provisioner/<pv> 에 worker3 로컬로 묶임
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: crypto-cti
  labels:
    app: postgres
spec:
  type: ClusterIP
  # Do not pin clusterIP. In-cluster clients must use Service DNS:
  # postgres.crypto-cti.svc.cluster.local
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: crypto-cti
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker3
      securityContext:
        fsGroup: 999  # postgres group in official image
      containers:
        - name: postgres
          image: postgres:14
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
