# Why: AI Response Service가 NetworkPolicy와 Pod를 조작할 수 있는 권한 부여
# Note: ClusterRole을 사용하여 모든 네임스페이스에서 작동 가능
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-response-role
  labels:
    app: ai-response
    managed-by: argocd
rules:
  # NetworkPolicy 생성/삭제 (Pod 격리)
  # Why: AI가 판단한 악성 Pod를 네트워크 격리하기 위해 필요
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete", "patch"]

  # Pod 조회/삭제
  # Why: 고위험 Pod는 즉시 삭제하여 추가 공격 방지
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]

  # Pod 정보 조회 (labels 등)
  # Why: NetworkPolicy 생성 시 Pod labels 필요
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

  # Cilium NetworkPolicy (IP 차단) - 선택적
  # Why: 공격자 IP를 차단하여 추가 공격 방지
  # Note: Cilium이 설치되어 있어야 사용 가능
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "delete", "patch"]
