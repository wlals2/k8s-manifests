# Why: Kustomize를 사용하여 ArgoCD가 리소스를 자동 배포
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: security

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - ghcr-sealedsecret.yaml
  - discord-webhook-sealedsecret.yaml
  - claude-api-key-sealedsecret.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app: ai-response
  managed-by: argocd
