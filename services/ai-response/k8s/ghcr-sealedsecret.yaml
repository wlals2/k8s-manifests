# Why: ghcr.io private registry에서 이미지를 pull하기 위한 인증 정보
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-secret
  namespace: security
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-secret
      namespace: security
    type: kubernetes.io/dockerconfigjson
