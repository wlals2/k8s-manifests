# Why: AI Response Service를 Falco Sidekick에서 접근하기 위한 ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: ai-response-service
  namespace: security
  labels:
    app: ai-response
    managed-by: argocd
spec:
  type: ClusterIP
  # Why: 내부 통신용 (Falco Sidekick → AI Service)

  selector:
    app: ai-response

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
      # Why: Falco Sidekick이 http://ai-response-service.security.svc.cluster.local:8000/analyze 로 호출
