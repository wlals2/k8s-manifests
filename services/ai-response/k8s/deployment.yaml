# Why: Falco Alert를 AI로 분석하고 자동 대응하는 서비스
# 추후 AI 판단 데이터를 축적한 뒤 Talon Rule로 변환하여 비용 0 운영 전환
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-response-service
  namespace: security
  labels:
    app: ai-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-response
  template:
    metadata:
      labels:
        app: ai-response
    spec:
      serviceAccountName: ai-response-sa

      containers:
        - name: ai-response
          # Why: ghcr.io 사용 (기존 blog-web과 동일 패턴)
          image: ghcr.io/wlals2/ai-response:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claude-api-key
                  key: api-key
                  # Why: Secret 미생성 시에도 Pod 시작 허용 (health check 통과, API 호출만 실패)
                  optional: true

            - name: LOG_LEVEL
              value: "INFO"

            - name: K8S_IN_CLUSTER
              value: "true"

            # Why: Phase 1은 DRY-RUN → AI 판단만 수행, 실제 대응 없음
            - name: DRY_RUN
              value: "true"

            - name: RISK_THRESHOLD_ISOLATE
              value: "50"

            - name: RISK_THRESHOLD_DELETE
              value: "80"

            # Why: Wazuh Discord와 동일한 채널로 AI 판단 결과 전송
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook-url
                  key: url

            # Why: AI 판단 결과를 로깅하여 추후 Talon Rule 변환에 활용
            - name: LOG_AI_DECISIONS
              value: "true"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always
