# Why: AI Response Service가 Discord로 AI 판단 결과를 전송하기 위한 webhook URL
# monitoring namespace의 discord-webhook과 동일한 URL (SealedSecret은 namespace-scoped)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: discord-webhook-url
  namespace: security
spec:
  encryptedData:
    url: 
  template:
    metadata:
      name: discord-webhook-url
      namespace: security
