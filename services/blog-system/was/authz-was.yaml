# ==============================================================================
# WAS AuthorizationPolicy
# ==============================================================================
# 목적: was-service 접근 제어
#
# 보안 원칙:
# - blog-system namespace의 pod에서만 접근 허용
# - 포트 8080만 허용
# - /api/*, /actuator/* 경로만 허용
# - 기타 모든 접근 차단 (외부 직접 접근 불가)
#
# 주의:
# - mTLS DISABLE 모드이므로 principals 조건 사용 불가
# - namespace 기반 접근 제어만 적용
#
# 효과:
# - 외부 → was 직접 접근 차단
# - blog-system namespace → was만 허용
# ==============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: was-authz
  namespace: blog-system
  labels:
    app: was
    tier: backend
spec:
  selector:
    matchLabels:
      app: was

  action: ALLOW

  rules:
  # Rule 1: 애플리케이션 트래픽 (8080 포트)
  # Why: blog-system namespace 내부 트래픽만 허용
  - to:
    - operation:
        ports: ["8080"]  # WAS 포트만 허용
        paths: ["/api/*", "/actuator/*", "/auth", "/auth/*"]  # API, 모니터링, OAuth 경로만

  # Rule 2: Blackbox Exporter Health Check (monitoring namespace → was:8080/actuator/health)
  # Why: 외부 가용성 모니터링용
  # Why: Health check 엔드포인트만 허용 (보안 강화)
  - from:
    - source:
        namespaces: ["monitoring"]
    to:
    - operation:
        ports: ["8080"]
        paths: ["/actuator/health"]

  # Rule 3: Prometheus 메트릭 수집 (15090 포트, 클러스터 내부 전체 허용)
  # Why: Istio Proxy 메트릭을 Prometheus가 스크랩하도록 허용
  # Why: 메트릭 전용 포트로 민감 정보 없음, from 조건 불필요
  - to:
    - operation:
        ports: ["15090"]  # Istio Proxy 메트릭 포트
