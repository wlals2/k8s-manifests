# ==============================================================================
# mysql-pxc - Percona XtraDB Cluster (MySQL HA)
# ==============================================================================
# 목적: 단일 MySQL → 3노드 동기 복제 클러스터로 전환 (자동 Failover)
# 의존성: pxc-operator (pxc-operator namespace)가 먼저 설치되어야 함
# ==============================================================================
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: mysql-pxc
spec:
  crVersion: "1.19.0"

  # Why: secretsName 미지정 → Operator가 "mysql-pxc-secrets" 자동 생성
  #      Phase 4에서 root 비밀번호를 추출하여 WAS Secret에 반영

  # Why: 홈랩 내부 통신이므로 TLS 불필요, 외부 노출 없음
  unsafeFlags:
    tls: true
  tls:
    enabled: false

  upgradeOptions:
    apply: disabled
    schedule: "0 4 * * *"

  pxc:
    size: 3
    image: percona/percona-xtradb-cluster:8.0.36-28.1
    # Why: 전체 클러스터 crash 시 Operator가 최신 seqno 노드를 자동 감지해 bootstrap
    autoRecovery: true

    # Why: ADR-003 — MySQL은 Server-First 프로토콜, sidecar 주입 시 데드락
    annotations:
      sidecar.istio.io/inject: "false"

    # Why: ADR-016 — kube-apiserver 호출 불필요
    containerSecurityContext:
      runAsNonRoot: true

    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 600m
        memory: 1Gi

    # Why: PXC 3노드를 서로 다른 Worker에 분산 → 단일 노드 장애 시 쿼럼 유지
    affinity:
      antiAffinityTopologyKey: "kubernetes.io/hostname"

    podDisruptionBudget:
      maxUnavailable: 1

    # Why: HAProxy health check가 33062(Admin Port)로 wsrep 상태 확인
    #      Operator가 node.cnf에 admin-address=<pod_ip> 자동 설정 → admin_port만 추가
    configuration: |
      [mysqld]
      admin_port=33062

    volumeSpec:
      persistentVolumeClaim:
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

  haproxy:
    enabled: true
    size: 2
    image: percona/haproxy:2.8.17

    # Why: ADR-003과 동일 — HAProxy도 PXC와 직접 통신하므로 sidecar 제외
    annotations:
      sidecar.istio.io/inject: "false"

    # Why: Kyverno require-non-root 정책 준수
    containerSecurityContext:
      runAsNonRoot: true

    # Why: 실측 148m에서 CPU 스로틀링 → Readiness timeout → WAS 연결 실패 (2026-03-17)
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 800m
        memory: 512Mi

    affinity:
      antiAffinityTopologyKey: "kubernetes.io/hostname"

    podDisruptionBudget:
      maxUnavailable: 1

  proxysql:
    enabled: false

  logcollector:
    enabled: false

  backup:
    # Why: PXC 8.0 호환 backup 이미지 (8.4용은 percona-xtrabackup:8.4.0-5.1)
    image: percona/percona-xtrabackup:8.0.35-34.1
    storages:
      s3-backup:
        type: s3
        verifyTLS: true
        s3:
          bucket: jimin-backup
          credentialsSecret: aws-s3-credentials
          region: ap-northeast-2
    schedule:
      - name: "daily-backup"
        schedule: "0 18 * * *"
        keep: 7
        storageName: s3-backup
