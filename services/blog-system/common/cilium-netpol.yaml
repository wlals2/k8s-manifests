# ==============================================================================
# Cilium Network Policies for blog-system
# ==============================================================================
# 목적: L3/L4 네트워크 격리 (Zero Trust)
#
# 계층적 보안:
# - Cilium NetworkPolicy (L3/L4): IP/포트 기반 차단 ← 이 파일
# - Istio AuthorizationPolicy (L7): HTTP 경로/메서드 기반 차단
#
# 보안 효과:
# - Lateral movement 차단 (컨테이너 탈취 시 확산 방지)
# - 최소 권한 원칙 (필요한 트래픽만 허용)
# - 감사 로그 (Hubble로 모든 연결 추적)
#
# 참고:
# - Istio mesh 내부: Istio AuthZ + Cilium NetworkPolicy
# - Istio mesh 외부 (mysql): Cilium NetworkPolicy만
# ==============================================================================

---
# ==============================================================================
# MySQL 보호
# ==============================================================================
# 허용: was → mysql:3306
# 차단: 기타 모든 접근 (monitoring, 외부 pod 등)
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mysql-isolation
  namespace: blog-system
  labels:
    app: mysql
    tier: database
spec:
  description: "MySQL access restricted to WAS pods only"

  endpointSelector:
    matchLabels:
      app: mysql  # mysql Pod에만 적용

  # Ingress (들어오는 트래픽)
  ingress:
  # Rule 1: was → mysql:3306 허용
  - fromEndpoints:
    - matchLabels:
        app: was  # was Pod에서만
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 2: 같은 Pod 내부 통신 허용 (헬스체크 등)
  - fromEndpoints:
    - matchLabels:
        app: mysql
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 3: mysql-backup → mysql:3306 허용 (CronJob 백업 - blog-system)
  - fromEndpoints:
    - matchLabels:
        app: mysql-backup
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 3-2: mysql-backup → mysql:3306 허용 (CronJob 백업 - backup-system)
  # Why: backup-system namespace의 Cronjob도 MySQL 백업 가능하도록 허용
  - fromEndpoints:
    - matchLabels:
        app: mysql-backup
        io.kubernetes.pod.namespace: backup-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 4: mysql-exporter → mysql:3306 허용 (Prometheus 메트릭)
  - fromEndpoints:
    - matchLabels:
        app: mysql-exporter
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 5: blackbox-exporter → mysql:3306 허용 (TCP 가용성 체크)
  # Why: Blackbox Exporter의 TCP probe로 MySQL 포트 열림 여부 체크
  # Why: MySQL 프로토콜 파싱 없이 TCP 연결만 테스트 (보안 강화)
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Egress (나가는 트래픽) - DNS만 허용
  egress:
  # Rule 1: DNS 쿼리 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"

---
# ==============================================================================
# WAS 보호
# ==============================================================================
# 허용: web → was:8080
# 차단: 기타 모든 접근 (monitoring, 외부 pod 등)
#
# 참고: Istio AuthZ에서도 같은 정책 적용 (심층 방어)
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: was-isolation
  namespace: blog-system
  labels:
    app: was
    tier: backend
spec:
  description: "WAS access restricted to WEB pods only"

  endpointSelector:
    matchLabels:
      app: was  # was Pod에만 적용

  # Ingress
  ingress:
  # Rule 1: web → was:8080 허용 (L3/L4만 검사, L7은 Istio가 담당)
  - fromEndpoints:
    - matchLabels:
        app: web  # web Pod에서만
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  # Rule 2: 같은 Pod 내부 통신 허용
  - fromEndpoints:
    - matchLabels:
        app: was
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  # Rule 3: Istio sidecar 메트릭/헬스체크 (클러스터 전체 허용)
  # Why: Prometheus가 monitoring namespace에서 15090 포트 스크랩
  - fromEntities:
    - cluster  # 클러스터 내부 모든 namespace 허용
    toPorts:
    - ports:
      - port: "15090"  # Istio Proxy 메트릭
        protocol: TCP
      - port: "15021"  # Istio health check
        protocol: TCP

  # Rule 4: blackbox-exporter → was:8080 허용 (서비스 가용성 모니터링)
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  # Rule 5: Prometheus → was:8080 허용 (JVM/앱 메트릭 스크래핑)
  # Why: /actuator/prometheus 엔드포인트 수집. L7 경로 제한은 Istio was-authz가 담당
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  # Egress
  egress:
  # Rule 1: was → mysql:3306 허용
  - toEndpoints:
    - matchLabels:
        app: mysql
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 2: DNS 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"

  # Rule 3: Istio control plane 통신 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: istio-system
    toPorts:
    - ports:
      - port: "15012"  # Istio xDS
        protocol: TCP

  # Rule 4: Tempo (OpenTelemetry Collector) - Trace 전송
  - toEndpoints:
    - matchLabels:
        app: tempo
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "4317"  # OTLP gRPC
        protocol: TCP

  # Rule 5: 외부 HTTPS 허용 (RSS 수집, GitHub OTEL Agent 다운로드 등)
  # Why: RSS 소스 추가 시마다 FQDN 관리하는 것은 과도, port 443만 허용으로 충분
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

---
# ==============================================================================
# WEB 보호
# ==============================================================================
# 허용: 외부(Ingress) + 내부 모두 → web:80
# 차단: 없음 (WEB은 외부 접근 허용하는 계층)
#
# 참고: WEB은 Ingress 역할이므로 제한 완화
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-isolation
  namespace: blog-system
  labels:
    app: web
    tier: frontend
spec:
  description: "WEB accepts all traffic on port 80 (acts as Ingress)"

  endpointSelector:
    matchLabels:
      app: web  # web Pod에만 적용

  # Ingress - 포트 80은 모두 허용
  ingress:
  # Rule 1: 모든 소스 → web:80 허용
  # Why: WEB은 Istio Ingress Gateway로부터 트래픽을 받는 진입점
  # Why: L7(HTTP 경로/메서드) 제어는 Istio AuthorizationPolicy가 담당 (ADR-001)
  - fromEntities:
    - all  # 모든 소스 (외부 Ingress 포함)
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP

  # Rule 2: Istio sidecar 메트릭/헬스체크 (클러스터 전체 허용)
  # Why: Prometheus가 monitoring namespace에서 15090 포트 스크랩
  - fromEntities:
    - cluster  # 클러스터 내부 모든 namespace 허용
    toPorts:
    - ports:
      - port: "15090"  # Istio Proxy 메트릭
        protocol: TCP
      - port: "15021"  # Istio health check
        protocol: TCP

  # Egress
  egress:
  # Rule 1: web → was:8080 허용
  - toEndpoints:
    - matchLabels:
        app: was
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  # Rule 2: DNS 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"

  # Rule 3: Istio control plane 통신 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: istio-system
    toPorts:
    - ports:
      - port: "15012"  # Istio xDS
        protocol: TCP

---
# ==============================================================================
# MySQL Exporter 보호
# ==============================================================================
# 허용: monitoring/prometheus → mysql-exporter:9104
# 차단: 기타 모든 접근
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mysql-exporter-isolation
  namespace: blog-system
  labels:
    app: mysql-exporter
    tier: monitoring
spec:
  description: "MySQL Exporter restricted to Prometheus scraping"

  endpointSelector:
    matchLabels:
      app: mysql-exporter  # mysql-exporter Pod에만 적용

  # Ingress
  ingress:
  # Rule 1: 클러스터 내부 → mysql-exporter:9104 허용 (Prometheus scraping)
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "9104"
        protocol: TCP

  # Rule 2: 같은 Pod 내부 통신 허용 (헬스체크)
  - fromEndpoints:
    - matchLabels:
        app: mysql-exporter
    toPorts:
    - ports:
      - port: "9104"
        protocol: TCP

  # Egress
  egress:
  # Rule 1: mysql-exporter → mysql:3306 (MySQL servcie) 허용
  - toEntities:
    - cluster # MySQL servcie (10.99.101.181) 허용
    - world # 외부 DNS 허용

---
# ==============================================================================
# MySQL Backup 보호
# ==============================================================================
# 허용: mysql-backup → mysql:3306 (백업)
# 허용: mysql-backup → S3 (업로드)
# 차단: 기타 모든 접근
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mysql-backup-isolation
  namespace: blog-system
  labels:
    app: mysql-backup
    tier: backup
spec:
  description: "MySQL Backup Job - access to MySQL and S3"

  endpointSelector:
    matchLabels:
      app: mysql-backup  # mysql-backup Pod에만 적용

  # Egress
  egress:
  # Rule 1: mysql-backup → mysql:3306 허용
  - toEndpoints:
    - matchLabels:
        app: mysql
        io.kubernetes.pod.namespace: blog-system
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP

  # Rule 2: DNS 허용
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"

  # Rule 3: S3 접근 허용 (AWS S3 endpoint)
  - toEntities:
    - world  # 외부 인터넷 (S3)
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP