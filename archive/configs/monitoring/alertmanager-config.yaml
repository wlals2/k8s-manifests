apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 30s
      repeat_interval: 4h
      receiver: 'discord-homelab'
      routes:
        - match:
            severity: critical
          receiver: 'discord-critical'
        - match:
            severity: warning
          receiver: 'discord-warning'

    receivers:
      # ℹ️ INFO 레벨 (기본) - Discord Webhook 직접 연동
      - name: 'discord-homelab'
        webhook_configs:
          - url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-'
            send_resolved: true

      # 🔥 CRITICAL 레벨 - Discord + Bot 자동 진단
      - name: 'discord-critical'
        webhook_configs:
          - url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-'
            send_resolved: true
          # Why: critical은 즉시 에이전트가 자동 진단·조치
          - url: 'http://192.168.1.187:9094/webhook'
            send_resolved: false

      # ⚠️ WARNING 레벨 - Discord + Bot 자동 진단
      - name: 'discord-warning'
        webhook_configs:
          - url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-'
            send_resolved: true
          # Why: warning도 에이전트가 원인 파악 (조치는 사람 확인 후)
          - url: 'http://192.168.1.187:9094/webhook'
            send_resolved: false

    inhibit_rules:
      # Critical 알람 발생 시 Warning 알람 억제
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']
