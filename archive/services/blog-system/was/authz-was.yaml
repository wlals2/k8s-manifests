# ==============================================================================
# WAS AuthorizationPolicy
# ==============================================================================
# 목적: was-service 접근 제어
#
# 보안 원칙:
# - /api/*, /auth/* → 모든 출발지 허용 (외부 사용자 접근 대상)
# - /actuator/*     → monitoring namespace만 허용 (내부 전용)
# - 포트 8080만 허용
# - 기타 모든 접근 차단
#
# 주의:
# - mTLS PERMISSIVE 모드에서 source.namespaces는 mTLS identity(SPIFFE ID) 기반
# - mesh 미참여 Pod(monitoring namespace 등)은 identity=unknown → namespace 매칭 불가
# - 따라서 /actuator/health는 from 조건 없이 허용 (ClusterIP로 내부 접근만 가능)
#
# 효과:
# - 외부 → /actuator/prometheus 직접 접근 차단 (monitoring namespace만)
# - /actuator/health는 Blackbox Exporter 호환성을 위해 전체 허용
# ==============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: was-authz
  namespace: blog-system
  labels:
    app: was
    tier: backend
spec:
  selector:
    matchLabels:
      app: was

  action: ALLOW

  rules:
  # Rule 1: 애플리케이션 트래픽 — 모든 출발지 허용
  # Why: /api/*, /auth/* 는 외부 사용자가 접근하는 공개 경로
  # Why: /actuator/* 를 여기서 제거 → monitoring namespace만 허용하는 Rule 2/3으로 분리
  - to:
    - operation:
        ports: ["8080"]
        paths: ["/api/*", "/auth", "/auth/*"]

  # Rule 2: Health Check (/actuator/health — 전체 허용)
  # Why: Blackbox Exporter(monitoring ns)가 sidecar 없이 접근 → mTLS identity 없음
  #      source.namespaces는 SPIFFE ID 기반이라 mesh 미참여 Pod에서 매칭 불가 → 403
  #      /actuator/health는 read-only 상태 정보만 반환, ClusterIP로 내부 접근만 가능
  - to:
    - operation:
        ports: ["8080"]
        paths: ["/actuator/health", "/actuator/health/*"]

  # Rule 3: Prometheus 메트릭 수집 (monitoring namespace → /actuator/prometheus)
  # Why: Prometheus ServiceMonitor가 메트릭을 스크랩하도록 허용
  # Why: Rule 1에서 분리 — actuator 경로는 monitoring namespace만 접근 가능
  - from:
    - source:
        namespaces: ["monitoring"]
    to:
    - operation:
        ports: ["8080"]
        paths: ["/actuator/prometheus"]

  # Rule 4: Istio Proxy 메트릭 포트 (15090)
  # Why: Prometheus가 Envoy 사이드카 메트릭을 스크랩하도록 허용
  - to:
    - operation:
        ports: ["15090"]
