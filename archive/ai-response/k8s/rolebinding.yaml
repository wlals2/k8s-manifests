# Why: ClusterRole을 ServiceAccount에 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-response-rolebinding
  labels:
    app: ai-response
    managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-response-role
subjects:
  - kind: ServiceAccount
    name: ai-response-sa
    namespace: security
