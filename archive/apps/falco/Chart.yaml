apiVersion: v2
name: my-falco
description: Wrapper chart for Falco security monitoring
type: application
version: 0.1.0        # 이 Wrapper Chart 자체의 버전 (내 마음대로)
appVersion: "0.42.1"  # Falco 애플리케이션 버전

# 외부 차트를 dependency로 가져오기
dependencies:
  - name: falco
    version: 8.0.0  # ✅ 최신 버전으로 업그레이드 (values.yaml 구조 문제 해결 기대)
    repository: https://falcosecurity.github.io/charts
