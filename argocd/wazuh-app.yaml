# ==============================================================================
# Wazuh SIEM ArgoCD Application
# ==============================================================================
# Why: Wazuh를 GitOps 방식으로 배포
# Note: Kustomize 기반 (Helm이 아님)
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlals2/k8s-manifests.git
    targetRevision: main
    path: apps/security/wazuh  # Kustomize base directory
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
