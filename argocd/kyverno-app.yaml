# Purpose: Kyverno Policy Engine ArgoCD Application
# Why: Helm Wrapper Chart를 GitOps로 배포
#      apps/kyverno/ → Kyverno 엔진 설치
#      configs/kyverno-policies/ → 정책들은 별도 App으로 분리 (kyverno-policies-app.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlals2/k8s-manifests.git
    targetRevision: main
    path: apps/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Why: Kyverno CRD가 262144 bytes 한도 초과
    #      ServerSideApply는 annotation에 전체 manifest를 저장하지 않아서 크기 제한 우회
    - ServerSideApply=true
    # Why: ignoreDifferences 설정이 apply 시에도 적용되도록 (ArgoCD v2.5+)
    - RespectIgnoreDifferences=true

  # ==============================================================================
  # Why: kyverno-api subchart의 policies.kyverno.io CRD 11개가 OutOfSync 표시
  #
  #      근본 원인 (2단계):
  #        1. Kubernetes API server가 CRD apply 시 spec.conversion({strategy:None}) 자동 주입
  #        2. ArgoCD controller가 ServerSideApply로 해당 필드의 owner가 됨
  #           → managedFields에 argocd-controller가 f:conversion 소유
  #           → ArgoCD가 자신이 apply한 필드를 자신이 diff로 감지하는 무한 루프
  #
  #      해결: managedFieldsManagers로 argocd-controller 소유 필드를 diff 무시
  #            (ArgoCD v2.7+ / v3.x 지원)
  # ==============================================================================
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      managedFieldsManagers:
        - argocd-controller  # argocd-controller가 소유한 필드(spec.conversion 등) 무시
