# Purpose: Kyverno Policy Engine ArgoCD Application
# Why: Helm Wrapper Chart를 GitOps로 배포
#      apps/kyverno/ → Kyverno 엔진 설치
#      configs/kyverno-policies/ → 정책들은 별도 App으로 분리 (kyverno-policies-app.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlals2/k8s-manifests.git
    targetRevision: main
    path: apps/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Why: Kyverno CRD가 262144 bytes 한도 초과
    #      ServerSideApply는 annotation에 전체 manifest를 저장하지 않아서 크기 제한 우회
    - ServerSideApply=true
    # Why: ignoreDifferences 설정이 apply 시에도 적용되도록 (ArgoCD v2.5+)
    - RespectIgnoreDifferences=true

  # ==============================================================================
  # Why: kyverno-api subchart의 policies.kyverno.io CRD 11개가 OutOfSync 표시
  #      원인: Kubernetes API server가 CRD apply 시 spec.conversion({strategy:None})을
  #            자동으로 주입 → Chart에는 없는 필드 → ArgoCD가 diff 감지
  #      해결: CRD의 spec.conversion, status 필드를 ignoreDifferences로 무시
  # ==============================================================================
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion  # Kubernetes가 자동 주입하는 변환 전략 필드
        - /status           # CRD 상태 필드 (ArgoCD 관리 대상 아님)
