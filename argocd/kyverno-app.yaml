# Purpose: Kyverno Policy Engine ArgoCD Application
# Why: Helm Wrapper Chart를 GitOps로 배포
#      apps/kyverno/ → Kyverno 엔진 설치
#      configs/kyverno-policies/ → 정책들은 별도 App으로 분리 (kyverno-policies-app.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlals2/k8s-manifests.git
    targetRevision: main
    path: apps/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Why: Kyverno CRD가 262144 bytes 한도 초과
    #      ServerSideApply는 annotation에 전체 manifest를 저장하지 않아서 크기 제한 우회
    - ServerSideApply=true
    # Why: ignoreDifferences 설정이 apply 시에도 적용되도록 (ArgoCD v2.5+)
    - RespectIgnoreDifferences=true

  # ==============================================================================
  # Why: kyverno-api subchart의 policies.kyverno.io CRD 11개가 OutOfSync 표시
  #
  #      근본 원인 (ArgoCD UI Diff로 최종 확인):
  #        Chart가 metadata.labels: {} (빈 labels)를 렌더링하지만
  #        클러스터 CRD에는 labels 필드 자체가 없음 → diff 감지
  #
  #      추가: spec.conversion ({strategy:None})도 K8s API server가 자동 주입
  #            status도 runtime 생성 필드
  # ==============================================================================
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels  # Chart가 labels: {} 렌더링하지만 클러스터엔 labels 없음
        - /spec/conversion  # K8s API server가 자동 주입하는 변환 전략
        - /status           # CRD 상태 필드 (runtime 생성)
