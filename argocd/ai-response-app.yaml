# Why: Falco Alert AI 자동 분석 서비스 (Phase 1: DRY-RUN)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-response
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlals2/k8s-manifests.git
    targetRevision: main
    path: services/ai-response/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
