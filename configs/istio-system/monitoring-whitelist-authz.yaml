---
# 모니터링 도구 접근 제어 (L7 - Host 헤더 기반)
# ADR 001 원칙: Cilium(L3/L4) 개방, Istio(L7) Host별 IP 제한
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: monitoring-whitelist
  namespace: istio-system
  annotations:
    description: "Host별 IP 제어: blog는 모두 허용, 모니터링 도구는 192.168.1.0/24만"
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway  # Gateway에 적용
  action: ALLOW
  rules:
  # 1. blog 정적 페이지는 모두 허용 (Hugo 블로그 공개)
  # Why: 블로그 콘텐츠는 전세계 공개, API/Board/Auth/Status는 별도 규칙으로 IP 제한
  # Why: /status*는 Trivy CVE, Falco 보안 이벤트 등 민감 정보 포함 → 내부 전용 (Rule 3)
  - to:
    - operation:
        hosts: ["blog.jiminhome.shop"]
        notPaths: ["/api/*", "/board/*", "/auth", "/auth/*", "/status", "/status/*"]
    # from 없음 → 모든 소스 IP 허용

  # 2. blog API/Board/Auth/Status는 내부 네트워크만 허용
  # Why: 외부에서 게시글 CRUD 방지
  # Why: /status는 Trivy CVE 상세, Falco CRITICAL 이벤트, SLO 위반 등 보안 민감 정보 포함
  - to:
    - operation:
        hosts: ["blog.jiminhome.shop"]
        paths: ["/api/*", "/board/*", "/auth", "/auth/*", "/status", "/status/*"]
    from:
    - source:
        remoteIpBlocks: ["192.168.1.0/24"]

  # 3. 모니터링 도구는 내부 네트워크만 허용
  - to:
    - operation:
        hosts:
        - "hubble.jiminhome.shop"
        - "kiali.jiminhome.shop"
        - "argocd.jiminhome.shop"
        - "monitoring.jiminhome.shop"
        - "grafana.jiminhome.shop"
        - "prom.jiminhome.shop"
        - "alert.jiminhome.shop"
        - "wazuh.jiminhome.shop"
    from:
    - source:
        remoteIpBlocks: ["192.168.1.0/24"]  # 사내 IP만
