---
# 모니터링 도구 접근 제어 (L7 - Host 헤더 기반)
# ADR 001 원칙: Cilium(L3/L4) 개방, Istio(L7) Host별 IP 제한
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: monitoring-whitelist
  namespace: istio-system
  annotations:
    description: "Host별 IP 제어: blog는 모두 허용, 모니터링 도구는 192.168.1.0/24만"
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway  # Gateway에 적용
  action: ALLOW
  rules:
  # 1. blog 정적 페이지는 모두 허용 (Hugo 블로그 공개)
  # Why: 블로그 콘텐츠는 전세계 공개, API/Board/Auth는 별도 규칙으로 IP 제한
  - to:
    - operation:
        hosts: ["blog.jiminhome.shop"]
        notPaths: ["/api/*", "/board/*", "/auth", "/auth/*"]
    # from 없음 → 모든 소스 IP 허용

  # 2. 뉴스 조회 API는 전세계 공개 (읽기 전용, 이미 공개된 RSS 데이터)
  # Why: /news 페이지에서 외부 방문자가 JS fetch로 뉴스를 조회할 수 있어야 함
  #      PATCH/POST (AI 요약 업데이트, 수동 수집)는 Rule 3에서 내부 전용 유지
  - to:
    - operation:
        hosts: ["blog.jiminhome.shop"]
        paths: ["/api/news", "/api/news/category/*"]
        methods: ["GET"]
    # from 없음 → 모든 소스 IP 허용

  # 3. blog API/Board/Auth는 내부 네트워크만 허용 (게시글 CRUD 보호)
  # Why: 외부에서 게시글 생성/수정/삭제, 뉴스 쓰기 작업 방지
  - to:
    - operation:
        hosts: ["blog.jiminhome.shop"]
        paths: ["/api/*", "/board/*", "/auth", "/auth/*"]
    from:
    - source:
        remoteIpBlocks: ["192.168.1.0/24"]

  # 3. 모니터링 도구는 192.168.1.0/24만 허용 (내부 전용)
  - to:
    - operation:
        hosts:
        - "hubble.jiminhome.shop"
        - "kiali.jiminhome.shop"
        - "argocd.jiminhome.shop"
        - "monitoring.jiminhome.shop"
        - "grafana.jiminhome.shop"
        - "prom.jiminhome.shop"
        - "alert.jiminhome.shop"
        - "wazuh.jiminhome.shop"
    from:
    - source:
        remoteIpBlocks: ["192.168.1.0/24"]  # 사내 IP만
