# ==============================================================================
# SLI Recording Rules
# ==============================================================================
# 목적: SLI(Service Level Indicator) 메트릭을 미리 계산하여 쿼리 성능 향상
#
# 데이터소스 3가지:
#   1. Blackbox Exporter → Availability (외부 관점: 접속 가능한가?)
#   2. Istio Metrics     → Error Rate, Latency p95/p99 (실제 트래픽 기반)
#   3. Tempo Span Metrics → 서비스별 RED (WEB/WAS/MySQL 개별 추적)
#
# SLO 목표:
#   - Availability: 99% (30일 기준, 허용 다운타임 7.2시간)
#   - Latency p95: < 500ms
#   - Error Rate (5xx): < 1%
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sli-recording-rules
  namespace: monitoring
  labels:
    # Why: Prometheus ruleSelector와 매칭 필수 (Platform Conformity)
    prometheus: kube-prometheus
    app: prometheus
    component: recording-rules
    slo: "true"
spec:
  groups:
    # ==========================================================================
    # 1. Availability SLI (Blackbox Exporter)
    # ==========================================================================
    # Why: 외부 관점에서 "사용자가 접속할 수 있는가?" 측정
    # 데이터소스: probe_success (WEB 서비스 Probe)
    - name: sli-availability
      interval: 30s
      rules:
        - record: sli:availability:1m
          # Why: 실시간 가용성 모니터링 (Dashboard 표시용)
          expr: avg_over_time(probe_success{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[1m])

        - record: sli:availability:5m
          # Why: 단기 추세 (순간 장애 노이즈 제거)
          expr: avg_over_time(probe_success{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[5m])

        - record: sli:availability:1h
          # Why: SLO Alert 조건 (1시간 평균 < 99% → Warning)
          expr: avg_over_time(probe_success{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[1h])

        - record: sli:availability:30d
          # Why: 월간 SLO 달성률 계산 (99% 목표)
          expr: avg_over_time(probe_success{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[30d])

    # ==========================================================================
    # 2. Latency SLI (Blackbox + Istio)
    # ==========================================================================
    # Why: Blackbox는 Synthetic Check (30초 1번), Istio는 실제 트래픽 전수 측정
    #      둘 다 있어야 "외부에서 본 속도" + "내부 실제 속도" 비교 가능
    - name: sli-latency
      interval: 30s
      rules:
        # --- Blackbox 기반 (Synthetic Check, 외부 관점) ---
        - record: sli:latency:blackbox:1m
          # Why: Blackbox는 Gauge이므로 avg_over_time 사용 (Histogram 아님)
          expr: avg_over_time(probe_duration_seconds{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[1m])

        - record: sli:latency:blackbox:5m
          expr: avg_over_time(probe_duration_seconds{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"}[5m])

        # --- Istio 기반 (실제 트래픽, p95/p99) ---
        - record: sli:latency:p95:5m
          # Why: 실제 사용자 요청의 95번째 백분위 응답 시간
          #      평균은 느린 요청을 숨기지만, p95는 대부분의 사용자 경험을 반영
          expr: |
            histogram_quantile(0.95,
              sum(rate(istio_request_duration_milliseconds_bucket{
                destination_service_namespace="blog-system",
                reporter="destination"
              }[5m])) by (le, destination_service_name)
            )

        - record: sli:latency:p99:5m
          # Why: 상위 1% 최악의 응답 시간 (꼬리 지연 감지)
          expr: |
            histogram_quantile(0.99,
              sum(rate(istio_request_duration_milliseconds_bucket{
                destination_service_namespace="blog-system",
                reporter="destination"
              }[5m])) by (le, destination_service_name)
            )

    # ==========================================================================
    # 3. Error Rate SLI (Istio)
    # ==========================================================================
    # Why: Blackbox는 "접속 가능/불가능"만 알 수 있지만,
    #      Istio는 모든 HTTP 요청의 5xx 비율을 정확히 측정
    - name: sli-error-rate
      interval: 30s
      rules:
        - record: sli:error_rate:5m
          # Why: 전체 blog-system의 5xx 에러 비율 (0~1 범위)
          #      0.01 = 1%, SLO 목표: < 1%
          expr: |
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              response_code=~"5..",
              reporter="destination"
            }[5m]))
            /
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              reporter="destination"
            }[5m]))

        - record: sli:error_rate:by_service:5m
          # Why: 서비스별 에러율 → 문제가 WEB인지 WAS인지 특정
          expr: |
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              response_code=~"5..",
              reporter="destination"
            }[5m])) by (destination_service_name)
            /
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              reporter="destination"
            }[5m])) by (destination_service_name)

    # ==========================================================================
    # 4. Throughput SLI (Istio)
    # ==========================================================================
    # Why: 트래픽 변화 감지 → 갑자기 0이면 서비스 장애, 급증이면 부하 예상
    - name: sli-throughput
      interval: 30s
      rules:
        - record: sli:throughput:rps:1m
          # Why: 전체 blog-system 초당 요청 수 (RPS)
          expr: |
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              reporter="destination"
            }[1m]))

        - record: sli:throughput:rps:by_service:1m
          # Why: 서비스별 RPS → WEB vs WAS 트래픽 분포 파악
          expr: |
            sum(rate(istio_requests_total{
              destination_service_namespace="blog-system",
              reporter="destination"
            }[1m])) by (destination_service_name)

    # ==========================================================================
    # 5. Tempo Service RED (서비스별 호출 체인)
    # ==========================================================================
    # Why: Istio는 "서비스 간" 트래픽, Tempo는 "서비스 내부 span" 측정
    #      WAS→MySQL 호출이 느린지, WAS 내부 로직이 느린지 구분 가능
    - name: sli-tempo-red
      interval: 30s
      rules:
        - record: sli:tempo:calls_rate:1m
          # Why: Tempo span 기반 서비스별 호출 빈도
          expr: |
            sum(rate(traces_spanmetrics_calls_total[1m])) by (service_name, span_name, status_code)

        - record: sli:tempo:latency_p95:5m
          # Why: Tempo span 기반 서비스별 p95 응답 시간 (내부 호출 체인 추적)
          expr: |
            histogram_quantile(0.95,
              sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le, service_name)
            )

        - record: sli:tempo:service_graph_rps:1m
          # Why: 서비스 간 호출 관계 (client → server) 요청량
          expr: |
            sum(rate(traces_service_graph_request_total[1m])) by (client, server)
