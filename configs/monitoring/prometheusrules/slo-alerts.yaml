# ==============================================================================
# SLO Alert Rules
# ==============================================================================
# 목적: SLO(Service Level Objective) 위반 시 알림 전송
# 의존성: sli-recording-rules.yaml의 Recording Rules 메트릭 사용
#
# SLO 목표:
#   - Availability: 99% (30일 기준)
#   - Latency p95: < 500ms
#   - Error Rate (5xx): < 1%
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-alerts
  namespace: monitoring
  labels:
    # Why: Prometheus ruleSelector와 매칭 필수 (Platform Conformity)
    prometheus: kube-prometheus
    app: prometheus
    component: alert-rules
    slo: "true"
spec:
  groups:
    # ==========================================================================
    # SLO: Availability (가용성)
    # ==========================================================================
    # 목표: 99% (30일 기준), 허용 다운타임: 7.2시간/30일
    - name: slo-availability
      interval: 1m
      rules:
        - alert: SLOAvailabilityViolation1h
          # Why: 1시간 평균 가용성 99% 미만 → 단기 문제 감지
          expr: sli:availability:1h < 0.99
          for: 5m
          labels:
            severity: warning
            slo: availability
            component: blog-system
          annotations:
            summary: "가용성 SLO 위반 (1시간 평균)"
            description: |
              블로그 사이트 가용성이 1시간 평균 99% 미만입니다.
              현재 가용성: {{ $value | humanizePercentage }}
              목표: 99%

              조치:
              1. kubectl get pods -n blog-system
              2. kubectl logs -n blog-system -l app=web --tail=100
              3. Grafana SLO Dashboard에서 상세 분석

        - alert: SLOAvailabilityViolation30d
          # Why: 30일 평균 가용성 99% 미만 → 월간 SLO 미달
          expr: sli:availability:30d < 0.99
          for: 1h
          labels:
            severity: critical
            slo: availability
            component: blog-system
          annotations:
            summary: "가용성 SLO 30일 목표 미달성"
            description: |
              블로그 사이트 30일 평균 가용성이 99% 미만입니다.
              현재 가용성: {{ $value | humanizePercentage }}
              목표: 99%
              허용 다운타임: 7.2시간/30일

    # ==========================================================================
    # SLO: Latency (응답 시간)
    # ==========================================================================
    # 목표: p95 < 500ms
    - name: slo-latency
      interval: 1m
      rules:
        - alert: SLOLatencyViolation
          # Why: Istio 실제 트래픽 기반 p95가 500ms 초과 → 사용자 경험 저하
          expr: sli:latency:p95:5m{destination_service_name="web-service"} > 500
          for: 5m
          labels:
            severity: warning
            slo: latency
            component: blog-system
          annotations:
            summary: "응답 시간 SLO 위반 (p95 > 500ms)"
            description: |
              블로그 사이트 p95 응답 시간이 500ms를 초과했습니다.
              현재 p95: {{ $value | printf "%.0f" }}ms
              목표: < 500ms

              조치:
              1. Grafana SLO Dashboard에서 서비스별 Latency 확인
              2. kubectl top pods -n blog-system
              3. Tempo 추적으로 느린 구간 특정

    # ==========================================================================
    # SLO: Error Rate (에러율)
    # ==========================================================================
    # 목표: 5xx < 1%
    - name: slo-error-rate
      interval: 1m
      rules:
        - alert: SLOErrorRateViolation
          # Why: 5xx 에러율 1% 초과 → 100명 중 1명 이상 에러 경험
          expr: sli:error_rate:5m > 0.01
          for: 5m
          labels:
            severity: warning
            slo: error_rate
            component: blog-system
          annotations:
            summary: "에러율 SLO 위반 (5xx > 1%)"
            description: |
              블로그 사이트 5xx 에러율이 1%를 초과했습니다.
              현재 에러율: {{ $value | humanizePercentage }}
              목표: < 1%

              조치:
              1. kubectl logs -n blog-system -l app=web --tail=100 | grep -i error
              2. kubectl logs -n blog-system -l app=was --tail=100 | grep -i error
              3. SLO Dashboard에서 서비스별 에러율 확인

        - alert: SLOErrorRateCritical
          # Why: 5xx 에러율 5% 초과 → 심각한 장애
          expr: sli:error_rate:5m > 0.05
          for: 2m
          labels:
            severity: critical
            slo: error_rate
            component: blog-system
          annotations:
            summary: "심각한 에러율 (5xx > 5%)"
            description: |
              블로그 사이트 5xx 에러율이 5%를 초과했습니다!
              현재 에러율: {{ $value | humanizePercentage }}

              긴급 조치:
              1. kubectl rollout restart deployment web -n blog-system
              2. kubectl logs -n blog-system -l app=web --tail=200

    # ==========================================================================
    # Service Down (서비스 완전 중단)
    # ==========================================================================
    - name: slo-service-down
      interval: 30s
      rules:
        - alert: BlogServiceDown
          # Why: Blackbox probe가 완전 실패 → 서비스 접속 불가
          expr: probe_success{job="blackbox-http", instance="http://web-service.blog-system.svc.cluster.local:80"} == 0
          for: 1m
          labels:
            severity: critical
            slo: availability
            component: blog-system
            page: "true"
          annotations:
            summary: "블로그 사이트 완전 중단!"
            description: |
              블로그 사이트가 완전히 접속 불가능합니다.

              긴급 조치:
              1. kubectl get pods -n blog-system
              2. kubectl get svc -n blog-system
              3. Istio Gateway 확인: kubectl get gateway -n blog-system
              4. AuthorizationPolicy 확인: kubectl get authorizationpolicy -n istio-system

        - alert: WASServiceDown
          # Why: WEB probe만으로는 WAS 장애 감지 불가 (WEB이 살아있으면 SLO 알람 미발화)
          #      WAS actuator/health 직접 probe → WAS 컨테이너 기동 실패도 감지
          expr: probe_success{job="blackbox-http", instance="http://was-service.blog-system.svc.cluster.local:8080/actuator/health"} == 0
          for: 2m
          labels:
            severity: critical
            slo: availability
            component: blog-system
            page: "true"
          annotations:
            summary: "WAS 서비스 다운!"
            description: |
              WAS actuator/health 응답 없음 — API 요청 전체 실패 상태.

              긴급 조치:
              1. kubectl get pods -n blog-system -l app=was
              2. kubectl describe pod -n blog-system -l app=was | grep -A5 "Events:"
              3. kubectl logs -n blog-system -l app=was --tail=100

        - alert: WASContainerNotReady
          # Why: WAS Pod phase=Running이지만 컨테이너 not ready (CreateContainerConfigError 등)는
          #      KubePodNotReady와 probe 알람 모두 미감지 — 컨테이너 레벨 직접 체크 필요
          expr: kube_pod_container_status_ready{namespace="blog-system", container="was"} == 0
          for: 5m
          labels:
            severity: warning
            component: blog-system
          annotations:
            summary: "WAS 컨테이너 Not Ready"
            description: |
              WAS 컨테이너가 5분 이상 Not Ready 상태입니다.
              Pod phase=Running이지만 컨테이너 내부 문제 (Secret 미마운트, ConfigMap 누락 등) 가능성.

              진단:
              1. kubectl get pods -n blog-system -l app=was
              2. kubectl describe pod -n blog-system -l app=was | grep -E "State:|Reason:|Events:" -A5
