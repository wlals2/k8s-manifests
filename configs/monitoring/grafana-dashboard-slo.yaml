# ==============================================================================
# Grafana Dashboard ConfigMap - SLO Overview (Level 1)
# ==============================================================================
# Why: "문제가 있는가?"를 한눈에 파악하는 Level 1 대시보드
#      SLI Recording Rules 기반으로 가용성, 에러율, 레이턴시, 서비스 상태를 표시
#
# 의존성:
#   - PrometheusRule: sli:availability, sli:error_rate, sli:latency, sli:throughput
#   - Blackbox Exporter: probe_success (WEB/WAS health check)
#   - MySQL Exporter: mysql_up
#   - Tempo: sli:tempo:service_graph_rps, sli:tempo:latency_p95
#
# 레이아웃 (5개 Row):
#   Row 1: SLO Status       - Gauge 4개 (Availability, Error Rate, WEB/WAS Latency)
#   Row 2: Service Health   - Stat 4개 (RPS, WEB/WAS/MySQL 상태)
#   Row 3: Trend            - TimeSeries 2개 (Latency 추세, Error+RPS 듀얼축)
#   Row 4: Availability     - State Timeline 1개 (서비스 가용성 이력)
#   Row 5: Tempo            - TimeSeries 2개 (서비스 호출 관계, Tempo Latency)
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: monitoring
  labels:
    # Why: Grafana sidecar가 이 label로 자동 로드
    grafana_dashboard: "1"
data:
  slo-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "panels": [],
          "title": "\ud83d\udcca SLO Status",
          "type": "row"
        },
        {
          "title": "Availability (30d)",
          "description": "30\uc77c \ud3c9\uade0 \uac00\uc6a9\uc131. SLO \ubaa9\ud45c: 99%",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sli:availability:30d * 100",
              "legendFormat": "Availability",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 90,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 99 },
                  { "color": "green", "value": 99.5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "orientation": "auto"
          }
        },
        {
          "title": "Error Rate (5m)",
          "description": "5xx \uc5d0\ub7ec \ube44\uc728. SLO \ubaa9\ud45c: < 1%",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
