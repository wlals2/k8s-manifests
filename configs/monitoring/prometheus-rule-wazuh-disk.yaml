# PrometheusRule: Wazuh Indexer 디스크 모니터링
# Why: 디스크 사용률 80% 초과 시 알람 (로그 보관 기간 축소 필요)
#
# 목적:
#   - Wazuh Indexer PVC 디스크 사용률 모니터링
#   - 80% 초과 시 Warning 알람
#   - 90% 초과 시 Critical 알람
#
# 의존성:
#   - Prometheus: ServiceMonitor (kubelet metrics)
#   - Discord Webhook: 알람 전송
#
# 참고:
#   - Prometheus Alert: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wazuh-disk-alert
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
  - name: wazuh-disk
    interval: 30s
    rules:
    # Alert 1: 디스크 사용률 80% 초과 (Warning)
    - alert: WazuhIndexerDiskHigh
      expr: |
        (
          kubelet_volume_stats_used_bytes{namespace="security",persistentvolumeclaim=~".*wazuh-indexer.*"}
          / kubelet_volume_stats_capacity_bytes{namespace="security",persistentvolumeclaim=~".*wazuh-indexer.*"}
        ) > 0.8
      for: 5m
      labels:
        severity: warning
        component: wazuh
        category: disk
      annotations:
        summary: "Wazuh Indexer 디스크 사용률 80% 초과"
        description: |
          Wazuh Indexer PVC 디스크 사용률이 {{ $value | humanizePercentage }}입니다.

          **현재 상태**:
          - PVC: {{ $labels.persistentvolumeclaim }}
          - 사용률: {{ $value | humanizePercentage }}

          **액션**:
          1. 오래된 Index 확인: `kubectl exec -it wazuh-indexer-0 -n security -- curl localhost:9200/_cat/indices?v`
          2. 수동 삭제: `curl -X DELETE "localhost:9200/wazuh-alerts-4.x-2026.02.01"`
          3. 로그 보관 기간 축소 고려 (10d → 7d)

    # Alert 2: 디스크 사용률 90% 초과 (Critical)
    - alert: WazuhIndexerDiskCritical
      expr: |
        (
          kubelet_volume_stats_used_bytes{namespace="security",persistentvolumeclaim=~".*wazuh-indexer.*"}
          / kubelet_volume_stats_capacity_bytes{namespace="security",persistentvolumeclaim=~".*wazuh-indexer.*"}
        ) > 0.9
      for: 2m
      labels:
        severity: critical
        component: wazuh
        category: disk
      annotations:
        summary: "🚨 Wazuh Indexer 디스크 사용률 90% 초과 (긴급)"
        description: |
          Wazuh Indexer PVC 디스크 사용률이 {{ $value | humanizePercentage }}입니다.

          **긴급 조치 필요**:
          - PVC: {{ $labels.persistentvolumeclaim }}
          - 사용률: {{ $value | humanizePercentage }}

          **즉시 수행**:
          ```bash
          # 1. 가장 오래된 Index 삭제
          kubectl exec -it wazuh-indexer-0 -n security -- \
            curl -X DELETE "localhost:9200/wazuh-alerts-4.x-$(date -d '11 days ago' +%Y.%m.%d)"

          # 2. 디스크 사용률 재확인
          kubectl exec -it wazuh-indexer-0 -n security -- \
            curl localhost:9200/_cat/allocation?v
          ```

    # Alert 3: 로그 수집 중단 (5분간 로그 없음)
    - alert: WazuhNoLogsReceived
      expr: |
        rate(wazuh_alerts_total[5m]) == 0
      for: 5m
      labels:
        severity: warning
        component: wazuh
        category: log-collection
      annotations:
        summary: "Wazuh 로그 수집 중단 (5분간 로그 없음)"
        description: |
          Wazuh Manager가 5분간 로그를 받지 못했습니다.

          **확인 사항**:
          1. Fluentd DaemonSet 정상 작동: `kubectl get pods -n security -l app=fluentd-falco`
          2. Falco 정상 작동: `kubectl get pods -n security -l app=falco`
          3. Wazuh Manager 로그: `kubectl logs -n security wazuh-manager-0`
