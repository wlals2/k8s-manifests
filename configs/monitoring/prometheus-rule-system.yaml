# PrometheusRule: 시스템 리소스 모니터링
# Why: CPU/Memory 사용률 80% 초과 시 알람
#
# 목적:
#   - 노드 및 Pod CPU/Memory 사용률 모니터링
#   - Pod 재시작 빈도 모니터링
#   - 서비스 다운 감지
#
# 의존성:
#   - Prometheus: kube-state-metrics, node-exporter
#   - Discord Webhook: 알람 전송

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: system-resource-alert
  namespace: monitoring
  labels:
    # Why: Prometheus가 이 PrometheusRule을 인식하도록 label 필수
    prometheus: kube-prometheus
spec:
  groups:
  - name: system-resource
    interval: 30s
    rules:
    # Alert 1: 노드 CPU 사용률 80% 초과 (Warning)
    - alert: HighCPUUsage
      # Why: 노드 전체 CPU 사용률 (iowait 제외)
      expr: |
        (
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)
        ) > 0.8
      for: 10m
      labels:
        severity: warning
        component: node
        category: cpu
      annotations:
        summary: "노드 CPU 사용률 80% 초과"
        description: |
          노드 {{ $labels.instance }} CPU 사용률이 {{ $value | humanizePercentage }}입니다.

          **현재 상태**:
          - 노드: {{ $labels.instance }}
          - CPU 사용률: {{ $value | humanizePercentage }}

          **액션**:
          1. Top 프로세스 확인: `top -bn1 | head -20`
          2. CPU 사용 Pod 확인: `kubectl top pods -A --sort-by=cpu`
          3. 부하 분산 고려: HPA 설정 또는 Pod 증설

    # Alert 2: 노드 CPU 사용률 90% 초과 (Critical)
    - alert: CriticalCPUUsage
      expr: |
        (
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)
        ) > 0.9
      for: 5m
      labels:
        severity: critical
        component: node
        category: cpu
      annotations:
        summary: "🚨 노드 CPU 사용률 90% 초과 (긴급)"
        description: |
          노드 {{ $labels.instance }} CPU 사용률이 {{ $value | humanizePercentage }}입니다.

          **긴급 조치 필요**:
          - 노드: {{ $labels.instance }}
          - CPU 사용률: {{ $value | humanizePercentage }}

          **즉시 수행**:
          ```bash
          # 1. CPU 사용 상위 Pod 확인
          kubectl top pods -A --sort-by=cpu | head -10

          # 2. 불필요한 Pod 삭제 또는 스케일 다운
          kubectl scale deployment <deployment> --replicas=1

          # 3. 노드 재시작 고려 (최후 수단)
          ```

    # Alert 3: 노드 메모리 사용률 80% 초과 (Warning)
    - alert: HighMemoryUsage
      # Why: 노드 메모리 사용률 (캐시 제외)
      expr: |
        (
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        ) > 0.8
      for: 5m
      labels:
        severity: warning
        component: node
        category: memory
      annotations:
        summary: "노드 메모리 사용률 80% 초과"
        description: |
          노드 {{ $labels.instance }} 메모리 사용률이 {{ $value | humanizePercentage }}입니다.

          **현재 상태**:
          - 노드: {{ $labels.instance }}
          - 메모리 사용률: {{ $value | humanizePercentage }}

          **액션**:
          1. 메모리 사용 Pod 확인: `kubectl top pods -A --sort-by=memory`
          2. 메모리 사용량 확인: `free -h`
          3. OOMKilled Pod 확인: `kubectl get events -A | grep OOMKilled`

    # Alert 4: 노드 메모리 사용률 90% 초과 (Critical)
    - alert: CriticalMemoryUsage
      expr: |
        (
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        ) > 0.9
      for: 2m
      labels:
        severity: critical
        component: node
        category: memory
      annotations:
        summary: "🚨 노드 메모리 사용률 90% 초과 (긴급)"
        description: |
          노드 {{ $labels.instance }} 메모리 사용률이 {{ $value | humanizePercentage }}입니다.

          **긴급 조치 필요**:
          - 노드: {{ $labels.instance }}
          - 메모리 사용률: {{ $value | humanizePercentage }}

          **즉시 수행**:
          ```bash
          # 1. 메모리 사용 상위 Pod 확인
          kubectl top pods -A --sort-by=memory | head -10

          # 2. 캐시 메모리 정리
          echo 3 > /proc/sys/vm/drop_caches

          # 3. Pod 재시작 또는 스케일 다운
          kubectl rollout restart deployment <deployment>
          ```

    # Alert 5: Pod 재시작 빈도 높음 (5분 내 3회)
    - alert: PodRestartHigh
      # Why: Pod가 자주 재시작되면 안정성 문제
      expr: |
        rate(kube_pod_container_status_restarts_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        component: pod
        category: stability
      annotations:
        summary: "Pod 재시작 빈도 높음"
        description: |
          Pod {{ $labels.namespace }}/{{ $labels.pod }}가 자주 재시작되고 있습니다.

          **현재 상태**:
          - Namespace: {{ $labels.namespace }}
          - Pod: {{ $labels.pod }}
          - Container: {{ $labels.container }}
          - 재시작 빈도: {{ $value }} restarts/sec

          **액션**:
          1. Pod 로그 확인: `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} --previous`
          2. Pod 이벤트 확인: `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}`
          3. Liveness/Readiness Probe 확인
          4. OOMKilled 확인: `kubectl get events -n {{ $labels.namespace }} | grep OOMKilled`

    # Alert 6: 서비스 다운 (Pod 0개)
    - alert: ServiceDown
      # Why: Deployment가 0개 Pod로 스케일되면 서비스 정지
      expr: |
        kube_deployment_status_replicas_available == 0
      for: 2m
      labels:
        severity: critical
        component: service
        category: availability
      annotations:
        summary: "🚨 서비스 다운 (Pod 0개)"
        description: |
          Deployment {{ $labels.namespace }}/{{ $labels.deployment }}의 Pod가 0개입니다.

          **긴급 조치 필요**:
          - Namespace: {{ $labels.namespace }}
          - Deployment: {{ $labels.deployment }}
          - Available Pods: 0

          **즉시 수행**:
          ```bash
          # 1. Deployment 상태 확인
          kubectl get deployment -n {{ $labels.namespace }} {{ $labels.deployment }}

          # 2. Pod 상태 확인
          kubectl get pods -n {{ $labels.namespace }} -l app={{ $labels.deployment }}

          # 3. 이벤트 확인
          kubectl describe deployment -n {{ $labels.namespace }} {{ $labels.deployment }}

          # 4. 수동 스케일 업 (긴급)
          kubectl scale deployment -n {{ $labels.namespace }} {{ $labels.deployment }} --replicas=1
          ```
