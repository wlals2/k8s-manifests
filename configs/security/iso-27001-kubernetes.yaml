# Wazuh SCA Policy: ISO 27001 Compliance for Kubernetes
# Why: ISO 27001 정보보안 관리 체계 준수 여부 자동 검증
#
# 목적:
#   - Kubernetes 클러스터의 보안 설정 검증
#   - ISO 27001 요구사항 매핑
#   - 자동 Compliance 리포트 생성
#
# 의존성:
#   - Wazuh Manager: SCA 모듈 활성화
#   - Kubernetes API: RBAC 권한 필요
#
# 참고:
#   - ISO 27001: https://www.iso.org/standard/27001
#   - Wazuh SCA: https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/index.html
#   - Pod Security Standards: https://kubernetes.io/docs/concepts/security/pod-security-standards/

policy:
  id: "cis_kubernetes_iso27001"
  file: "iso-27001-kubernetes.yml"
  name: "ISO 27001 Compliance for Kubernetes Homelab"
  description: "ISO 27001 정보보안 관리 체계 준수 검증 (Kubernetes 환경)"
  references:
    - https://www.iso.org/standard/27001
    - https://kubernetes.io/docs/concepts/security/

requirements:
  # ISO 27001 A.9.4.1: 정보 시스템 접근 제한
  - id: 10001
    title: "Pod에 hostNetwork 사용 금지"
    description: "Pod가 Host Network를 사용하면 네트워크 격리가 무력화됨"
    rationale: "ISO 27001 A.9.4.1 - 시스템 접근 제한"
    remediation: "spec.hostNetwork: false로 설정"
    compliance:
      - iso27001: ["A.9.4.1"]
    condition: all
    rules:
      - 'c:kubectl get pods --all-namespaces -o json -> r:hostNetwork":true'

  - id: 10002
    title: "Pod에 privileged 모드 사용 금지"
    description: "Privileged Pod는 Host의 모든 권한을 가짐"
    rationale: "ISO 27001 A.9.4.1 - 최소 권한 원칙"
    remediation: "securityContext.privileged: false로 설정"
    compliance:
      - iso27001: ["A.9.4.1"]
    condition: all
    rules:
      - 'c:kubectl get pods --all-namespaces -o json -> r:privileged":true'

  # ISO 27001 A.13.1.1: 네트워크 보안 통제
  - id: 10010
    title: "NetworkPolicy 적용 필수"
    description: "기본적으로 모든 트래픽 허용은 위험"
    rationale: "ISO 27001 A.13.1.1 - 네트워크 통제"
    remediation: "모든 Namespace에 NetworkPolicy 적용"
    compliance:
      - iso27001: ["A.13.1.1"]
    condition: none
    rules:
      - 'c:kubectl get networkpolicies --all-namespaces -o json -> r:"items":\[\]'

  - id: 10011
    title: "Istio mTLS 모드 확인"
    description: "Service-to-Service 암호화 필요"
    rationale: "ISO 27001 A.13.1.1 - 네트워크 암호화"
    remediation: "PeerAuthentication mode: PERMISSIVE 이상"
    compliance:
      - iso27001: ["A.13.1.1", "A.10.1.1"]
    condition: all
    rules:
      - 'c:kubectl get peerauthentication -n istio-system -o json -> r:mode":"STRICT|PERMISSIVE'

  # ISO 27001 A.10.1.1: 암호화 정책
  - id: 10020
    title: "Secret 암호화 (SealedSecret 사용)"
    description: "평문 Secret은 Git에 저장 금지"
    rationale: "ISO 27001 A.10.1.1 - 암호화 정책"
    remediation: "SealedSecret 사용 또는 etcd 암호화"
    compliance:
      - iso27001: ["A.10.1.1"]
    condition: all
    rules:
      - 'c:kubectl get sealedsecrets --all-namespaces -o json -> r:"kind":"SealedSecret"'

  # ISO 27001 A.12.4.1: 로그 기록
  - id: 10030
    title: "감사 로그 활성화"
    description: "Kubernetes API 감사 로그 필수"
    rationale: "ISO 27001 A.12.4.1 - 로그 기록"
    remediation: "--audit-log-path 플래그 활성화"
    compliance:
      - iso27001: ["A.12.4.1"]
    condition: all
    rules:
      - 'c:ps aux -> r:kube-apiserver.*--audit-log-path'

  - id: 10031
    title: "로그 보관 기간 (최소 90일)"
    description: "ISO 27001 요구사항: 로그 90일 이상 보관"
    rationale: "ISO 27001 A.12.4.1 - 로그 보관"
    remediation: "Wazuh Indexer rolloverAge: 90d"
    compliance:
      - iso27001: ["A.12.4.1"]
    condition: all
    rules:
      - 'f:/etc/wazuh-indexer/opensearch.yml -> r:rolloverAge.*\d{2,}d'

  # ISO 27001 A.9.2.1: 사용자 등록 및 해지
  - id: 10040
    title: "RBAC 최소 권한 원칙"
    description: "불필요한 cluster-admin 권한 금지"
    rationale: "ISO 27001 A.9.2.1 - 최소 권한"
    remediation: "ClusterRoleBinding에서 cluster-admin 제거"
    compliance:
      - iso27001: ["A.9.2.1"]
    condition: none
    rules:
      - 'c:kubectl get clusterrolebindings -o json -> r:roleRef.*cluster-admin.*subjects.*User'

  # ISO 27001 A.14.2.5: 시스템 보안 테스트
  - id: 10050
    title: "보안 스캔 정기 실행 (Falco)"
    description: "런타임 보안 모니터링 필수"
    rationale: "ISO 27001 A.14.2.5 - 보안 테스트"
    remediation: "Falco DaemonSet 배포 및 정상 작동 확인"
    compliance:
      - iso27001: ["A.14.2.5"]
    condition: all
    rules:
      - 'c:kubectl get pods -n security -l app=falco -o json -> r:status":"Running'

  - id: 10051
    title: "취약점 스캔 (Trivy)"
    description: "컨테이너 이미지 취약점 스캔 필수"
    rationale: "ISO 27001 A.14.2.5 - 보안 테스트"
    remediation: "Trivy Operator 배포"
    compliance:
      - iso27001: ["A.14.2.5"]
    condition: all
    rules:
      - 'c:kubectl get vulnerabilityreports --all-namespaces -o json -> r:"kind":"VulnerabilityReport"'

  # ISO 27001 A.18.1.3: 지적 재산권 보호
  - id: 10060
    title: "Private Registry 사용"
    description: "공개 이미지 사용 시 라이선스 확인 필요"
    rationale: "ISO 27001 A.18.1.3 - 지적 재산권"
    remediation: "Private Registry 또는 검증된 Public Registry 사용"
    compliance:
      - iso27001: ["A.18.1.3"]
    condition: all
    rules:
      - 'c:kubectl get pods --all-namespaces -o json -> r:image":"(harbor\.jiminhome\.shop|ghcr\.io)'

  # ISO 27001 A.12.6.1: 취약점 관리
  - id: 10070
    title: "보안 패치 적용 (Kubernetes 버전)"
    description: "Kubernetes 버전이 너무 오래되면 취약점 존재"
    rationale: "ISO 27001 A.12.6.1 - 취약점 관리"
    remediation: "최신 Stable 버전으로 업그레이드"
    compliance:
      - iso27001: ["A.12.6.1"]
    condition: all
    rules:
      - 'c:kubectl version --short -> r:Server Version: v1\.(2[89]|[3-9]\d)'

  # ISO 27001 A.12.1.2: 변경 관리
  - id: 10080
    title: "GitOps 적용 (ArgoCD)"
    description: "수동 kubectl apply 금지, Git 기반 배포 필수"
    rationale: "ISO 27001 A.12.1.2 - 변경 관리"
    remediation: "모든 변경사항을 Git에 기록"
    compliance:
      - iso27001: ["A.12.1.2"]
    condition: all
    rules:
      - 'c:kubectl get applications -n argocd -o json -> r:"kind":"Application"'
