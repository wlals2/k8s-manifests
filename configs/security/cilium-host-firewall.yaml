# ==============================================================================
# Cilium Host Firewall - SSH 접근 제어
# ==============================================================================
# Purpose: 노드 SSH 접근을 내부 + Cloudflare WARP 기기만 허용, 외부 브루트포스 차단
#
# 허용 대상:
#   1. 내부 네트워크 (192.168.1.0/24): 홈랩 직접 접속
#   2. Cloudflare WARP CGNAT (100.64.0.0/10): WARP Connector 가상 NIC 대역
#      Why: WARP 클라이언트 → Cloudflare → WARP Connector(가상 NIC 100.x.x.x) → sshd
#
# 차단 대상:
#   외부 인터넷 (0.0.0.0/0): SSH Brute Force 방어
#   ingressDeny가 ingress보다 낮은 우선순위 → 허용 규칙이 우선 적용됨
#
# 다른 포트 (HTTP/HTTPS 등):
#   ingress/ingressDeny 규칙 없음 → 기존 방식 그대로 통과
#   Cloudflare Tunnel 서비스 노출: cloudflared outbound 연결 → inbound 불필요
#
# Dependencies:
#   - Cilium Host Firewall 활성화 (enable-host-firewall: true)
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-ssh
spec:
  nodeSelector:
    matchLabels: {}

  ingress:
    # Why: 홈랩 내부 네트워크 SSH 허용
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP

    # Why: Cloudflare WARP Connector 가상 NIC 대역 허용
    # WARP 클라이언트 → Cloudflare → WARP Connector(100.64.0.0/10) → sshd
    - fromCIDR:
        - 100.64.0.0/10
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP

  # Why: 위 허용 대상 외 모든 외부에서 SSH 차단 (Brute Force 방어)
  ingressDeny:
    - fromCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
