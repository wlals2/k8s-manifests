# ==============================================================================
# Cilium Host Firewall - SSH 외부 접근 차단
# ==============================================================================
# Purpose: 외부에서 오는 SSH Brute Force 공격을 노드 레벨에서 원천 차단
#
# 동작 원리:
#   ingressDeny: 외부(0.0.0.0/0)에서 SSH(22) → 차단
#   ingress:     내부(192.168.1.0/24)에서 SSH(22) → 허용
#
# Why ingressDeny를 사용하는가:
#   ingress만 쓰면 implicit deny → HTTP/HTTPS 등 다른 포트도 모두 차단됨
#   ingressDeny를 쓰면 SSH만 선택적으로 제한 → 다른 트래픽에 영향 없음
#
# Dependencies:
#   - Cilium Host Firewall 활성화 필요 (cilium-config: enable-host-firewall: true)
# ==============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-ssh
spec:
  nodeSelector:
    matchLabels: {}

  # Why: 외부 인터넷에서 SSH 시도 차단 (Brute Force 방어)
  ingressDeny:
    - fromCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP

  # Why: 내부 네트워크에서는 SSH 허용 (관리용)
  # ingressDeny보다 ingress가 우선순위 높음 → 내부는 허용됨
  ingress:
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
