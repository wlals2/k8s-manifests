# Wazuh Manager 리소스 제한
# Why: 홈랩 환경 최적화

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: security
spec:
  template:
    spec:
      containers:
      - name: wazuh-manager
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
