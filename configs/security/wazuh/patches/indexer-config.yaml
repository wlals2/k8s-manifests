# Wazuh Indexer 설정 최적화
# Why: 로그 보관 10d + 압축 활성화 (홈랩 환경)

apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-indexer-config
  namespace: security
data:
  opensearch.yml: |
    # Why: 로그 보관 기간 축소 (30d → 10d)
    cluster.name: wazuh-indexer

    # Why: 압축 활성화 (저장 공간 30-40% 절감)
    index.codec: best_compression

    # Why: Shard 수 축소 (홈랩 단일 노드)
    index.number_of_shards: 1
    index.number_of_replicas: 0

    # Why: Refresh interval 증가 (실시간성 낮춤)
    index.refresh_interval: 30s
