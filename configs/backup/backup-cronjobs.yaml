# ==============================================================================
# etcd 백업 CronJob
# ==============================================================================
# 목적: etcd snapshot을 S3에 자동 백업 (7일 보관, 일 1회)
# 의존성: aws-s3-credentials Secret, etcd 인증서, k8s-cp 노드
# S3 경로: s3://jimin-backup/etcd/YYYY-MM-DD/snapshot-TIMESTAMP.db
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup-to-s3
  namespace: backup-system
  labels:
    app: etcd-backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Why: 기본값 6은 재시도마다 S3에 중복 업로드 발생 → 2회로 제한
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: etcd-backup
        spec:
          # Why: etcd는 127.0.0.1:2379에서만 접근 가능 → hostNetwork 필수
          hostNetwork: true
          # Why: etcd는 Control Plane에서만 실행
          nodeName: k8s-cp
          restartPolicy: OnFailure

          containers:
          - name: etcd-backup
            image: alpine:3.19

            command:
            - /bin/sh
            - -ec
            - |
              echo "=== etcd Backup to S3 Started ==="
              START_TIME=$(date +%s)

              apk add --no-cache aws-cli curl wget tar

              # Why: Alpine에 etcdctl 패키지 없음 → GitHub Release에서 설치
              ETCD_VER=v3.5.11
              wget -q https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz
              tar -xzf etcd-${ETCD_VER}-linux-amd64.tar.gz
              cp etcd-${ETCD_VER}-linux-amd64/etcdctl /usr/local/bin/
              rm -rf etcd-${ETCD_VER}-linux-amd64*

              DATE=$(date +%Y-%m-%d)
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="/tmp/etcd-snapshot-$TIMESTAMP.db"
              S3_BUCKET="jimin-backup"
              S3_PATH="s3://$S3_BUCKET/etcd/$DATE/snapshot-$TIMESTAMP.db"

              # Step 1: etcd snapshot
              echo "Creating etcd snapshot..."
              ETCDCTL_API=3 etcdctl snapshot save $BACKUP_FILE \
                --endpoints=https://127.0.0.1:2379 \
                --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                --cert=/etc/kubernetes/pki/etcd/server.crt \
                --key=/etc/kubernetes/pki/etcd/server.key

              # Step 2: snapshot 무결성 검증
              echo "Verifying snapshot..."
              ETCDCTL_API=3 etcdctl snapshot status $BACKUP_FILE -w table

              # Step 3: S3 업로드
              echo "Uploading to S3: $S3_PATH"
              aws s3 cp $BACKUP_FILE $S3_PATH \
                --region ${AWS_DEFAULT_REGION} \
                --no-progress

              # Step 4: 업로드 검증
              END_TIME=$(date +%s)
              DURATION=$((END_TIME - START_TIME))
              FILE_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo "0")

              if aws s3 ls $S3_PATH --region ${AWS_DEFAULT_REGION}; then
                echo "Backup completed successfully!"
                echo "   Location: $S3_PATH"
                echo "   Size: $(ls -lh $BACKUP_FILE | awk '{print $5}')"
                echo "   Duration: ${DURATION}s"
              else
                echo "ERROR: S3 upload verification failed!"
                rm -f $BACKUP_FILE
                # Why: 메트릭 push는 best-effort (실패해도 백업 성공/실패 판단에 영향 없음)
                printf "# TYPE backup_success gauge\nbackup_success 0\n# TYPE backup_duration_seconds gauge\nbackup_duration_seconds %s\n" "$DURATION" \
                  | curl -s --max-time 5 --data-binary @- http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/etcd-backup-to-s3 || true
                exit 1
              fi

              # Step 5: 7일 이전 백업 삭제 (retention)
              # Why: S3 백업이 무한히 쌓이는 것 방지 → 7일치만 보관
              echo "Cleaning up old backups (retention: 7 days)..."
              # Why: Alpine BusyBox date는 GNU date -d 미지원 → epoch 연산 사용
              CUTOFF_DATE=$(date -d "@$(( $(date +%s) - 7*86400 ))" +%Y-%m-%d)
              if [ -n "$CUTOFF_DATE" ]; then
                aws s3 ls s3://$S3_BUCKET/etcd/ --region ${AWS_DEFAULT_REGION} | awk '{print $2}' | tr -d '/' | while read dir; do
                  if [ "$dir" \< "$CUTOFF_DATE" ] || [ "$dir" = "$CUTOFF_DATE" ]; then
                    echo "  Deleting old backup: etcd/$dir/"
                    aws s3 rm s3://$S3_BUCKET/etcd/$dir/ --recursive --region ${AWS_DEFAULT_REGION}
                  fi
                done
                echo "Cleanup completed."
              else
                echo "WARNING: Could not calculate cutoff date, skipping cleanup."
              fi

              # Step 6: 로컬 파일 정리
              rm -f $BACKUP_FILE

              # Step 7: 메트릭 push (best-effort, 실패해도 Job은 성공)
              printf "# TYPE backup_success gauge\nbackup_success 1\n# TYPE backup_duration_seconds gauge\nbackup_duration_seconds %s\n# TYPE backup_size_bytes gauge\nbackup_size_bytes %s\n" "$DURATION" "$FILE_SIZE" \
                | curl -s --max-time 5 --data-binary @- http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/etcd-backup-to-s3 || true

              echo "=== etcd Backup Completed ==="

            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_DEFAULT_REGION

            volumeMounts:
            # Why: etcd는 TLS 인증서로만 접근 가능
            - name: etcd-certs
              mountPath: /etc/kubernetes/pki/etcd
              readOnly: true

          volumes:
          - name: etcd-certs
            hostPath:
              path: /etc/kubernetes/pki/etcd
              type: Directory

---
# ==============================================================================
# MySQL 백업 CronJob
# ==============================================================================
# 목적: MySQL 데이터베이스를 S3에 자동 백업 (7일 보관)
# 실행: 매일 새벽 2시 30분 (etcd 백업 후)
# 의존성:
#   - mysql-secret Secret (backup-system namespace)
#   - aws-s3-credentials Secret (backup-system namespace)
#   - MySQL Service (mysql-service.blog-system.svc.cluster.local)
# S3 경로: s3://jimin-backup/mysql/YYYY-MM-DD/blog-system-TIMESTAMP.sql.gz
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup-to-s3
  namespace: backup-system
  labels:
    app: mysql-backup
spec:
  # 스케줄: 매일 새벽 2시 30분
  # 이유: etcd 백업 (2시) 후 30분 뒤 실행 (순차 백업)
  # 변경 가능: etcd 백업 시간 변경 시 함께 조정
  schedule: "30 2 * * *"

  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # MySQL 백업 중복 방지

  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mysql-backup
        spec:
          # restartPolicy: OnFailure
          # 이유: mysqldump 일시적 실패 대응 (네트워크 오류 등)
          restartPolicy: OnFailure

          containers:
          - name: mysql-backup
            # Why: mysql:8.0-debian 사용 — Alpine MariaDB는 caching_sha2_password 미지원
            #      8.0(Oracle Linux)은 apt-get 없음, debian 태그는 apt-get 사용 가능
            image: mysql:8.0-debian

            command:
            - /bin/sh
            - -ec
            - |
              echo "MySQL Backup to S3 Started"
              START_TIME=$(date +%s)

              # Why: mysql:8.0 이미지에 aws-cli/curl 없음 → apt로 설치
              apt-get update -qq && apt-get install -y -qq awscli curl gzip > /dev/null 2>&1

              DATE=$(date +%Y-%m-%d)
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="/tmp/blog-system-$TIMESTAMP.sql"
              COMPRESSED_FILE="/tmp/blog-system-$TIMESTAMP.sql.gz"
              S3_BUCKET="jimin-backup"
              S3_PATH="s3://$S3_BUCKET/mysql/$DATE/blog-system-$TIMESTAMP.sql.gz"

              # Step 1: mysqldump 실행
              echo "Creating MySQL dump..."
              # -h: MySQL 호스트 (Kubernetes Service DNS)
              # -u root: MySQL 사용자
              # -p${MYSQL_ROOT_PASSWORD}: 비밀번호 (환경 변수)
              # --all-databases: 모든 데이터베이스 백업
              # --single-transaction: 일관성 보장 (InnoDB 테이블용)
              # --quick: 메모리 사용 최소화 (대용량 테이블 대응)
              # --lock-tables=false: 테이블 잠금 안 함 (서비스 중단 방지)
              # --routines: Stored Procedures 포함
              # --triggers: Triggers 포함
              # --events: Events 포함
              mysqldump -h mysql-service.blog-system.svc.cluster.local \
                -u root -p${MYSQL_ROOT_PASSWORD} \
                --all-databases \
                --single-transaction \
                --quick \
                --lock-tables=false \
                --routines \
                --triggers \
                --events \
                > $BACKUP_FILE

              # Step 2: gzip 압축
              echo "Compressing backup..."
              # 압축 비율: 평균 70-80% (100MB → 20-30MB)
              # 이유: S3 비용 절감 및 전송 시간 단축
              gzip $BACKUP_FILE

              # Step 3: S3 업로드
              echo "Uploading to S3: $S3_PATH"
              aws s3 cp $COMPRESSED_FILE $S3_PATH \
                --region ${AWS_DEFAULT_REGION} \
                --no-progress

              # Step 4: 업로드 검증
              END_TIME=$(date +%s)
              DURATION=$((END_TIME - START_TIME))
              FILE_SIZE=$(stat -c%s "$COMPRESSED_FILE" 2>/dev/null || echo "0")

              if aws s3 ls $S3_PATH --region ${AWS_DEFAULT_REGION}; then
                echo "Backup completed successfully!"
                echo "   Location: $S3_PATH"
                echo "   Size: $(ls -lh $COMPRESSED_FILE | awk '{print $5}')"
                echo "   Duration: ${DURATION}s"

                # Why: Prometheus 수집을 위한 메트릭 push (성공)
                # Why: 메트릭 push는 best-effort (hostNetwork 환경에서 클러스터 DNS 미해석 가능)
                printf "# TYPE backup_success gauge\nbackup_success 1\n# TYPE backup_duration_seconds gauge\nbackup_duration_seconds %s\n# TYPE backup_size_bytes gauge\nbackup_size_bytes %s\n" "$DURATION" "$FILE_SIZE" \
                  | curl -s --max-time 5 --data-binary @- http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/mysql-backup-to-s3 || true
              else
                echo "S3 upload failed!"
                rm -f $COMPRESSED_FILE
                printf "# TYPE backup_success gauge\nbackup_success 0\n# TYPE backup_duration_seconds gauge\nbackup_duration_seconds %s\n" "$DURATION" \
                  | curl -s --max-time 5 --data-binary @- http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/mysql-backup-to-s3 || true
                exit 1
              fi

              # Step 5: 로컬 파일 정리
              rm -f $COMPRESSED_FILE

            env:
            # MySQL 비밀번호
            # Secret에서 가져옴: backup-system namespace의 mysql-secret
            # 주의: Secret은 SealedSecret으로 관리 (평문 Git 저장 금지)
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password

            # AWS 인증 정보
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_DEFAULT_REGION
