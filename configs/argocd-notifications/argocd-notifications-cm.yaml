# ==============================================================================
# ArgoCD Notifications ConfigMap
# ==============================================================================
# 목적: ArgoCD sync 상태 변화 시 Discord 알림 전송
# 의존성: argocd-notifications-secret (Discord webhook URL)
#         blog-system-app.yaml annotations (구독 등록)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Why: webhook 서비스 타입 사용 - Discord는 네이티브 지원 목록에 없으므로
  #      generic webhook으로 직접 Discord API 포맷에 맞춤
  service.webhook.discord: |
    url: $discord-webhook
    headers:
    - name: Content-Type
      value: application/json

  # ── 템플릿 ──────────────────────────────────────────────────────────────────

  template.app-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "❌ ArgoCD Sync 실패: {{.app.metadata.name}}",
              "color": 16711680,
              "fields": [
                {"name": "Sync 상태", "value": "{{.app.status.sync.status}}", "inline": true},
                {"name": "Health", "value": "{{.app.status.health.status}}", "inline": true},
                {"name": "Revision", "value": "{{.app.status.sync.revision}}", "inline": false},
                {"name": "메시지", "value": "{{range .app.status.conditions}}{{.message}}{{end}}", "inline": false}
              ]
            }]
          }

  template.app-health-degraded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "⚠️ ArgoCD Health Degraded: {{.app.metadata.name}}",
              "color": 16744272,
              "fields": [
                {"name": "Health", "value": "{{.app.status.health.status}}", "inline": true},
                {"name": "Sync 상태", "value": "{{.app.status.sync.status}}", "inline": true},
                {"name": "Revision", "value": "{{.app.status.sync.revision}}", "inline": false}
              ]
            }]
          }

  template.app-sync-succeeded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "✅ ArgoCD Sync 성공: {{.app.metadata.name}}",
              "color": 65280,
              "fields": [
                {"name": "Revision", "value": "{{.app.status.sync.revision}}", "inline": true},
                {"name": "Health", "value": "{{.app.status.health.status}}", "inline": true}
              ]
            }]
          }

  # ── 트리거 ──────────────────────────────────────────────────────────────────
  # Why: on-sync-status-unknown 제외 — Unknown은 ArgoCD 재시작 시 일시적으로 발생하는 정상 상태

  trigger.on-sync-failed: |
    - when: app.status.sync.status == 'OutOfSync'
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  trigger.on-sync-succeeded: |
    - when: app.status.sync.status == 'Synced' and app.status.health.status == 'Healthy'
      send: [app-sync-succeeded]
