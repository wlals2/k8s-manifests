# ==============================================================================
# Trivy Operator - 클러스터 내 CVE 자동 스캔
# ==============================================================================
# 목적: 배포된 이미지의 취약점을 VulnerabilityReport CRD로 자동 생성
# 의존성: AI Security Copilot TrivyCollector가 이 CRD를 조회
# ==============================================================================

# Why: Wrapper Chart이므로 모든 설정을 'trivy-operator:' 키 아래에 작성

trivy-operator:
  # Why: 홈랩은 리소스 제한적 → 스캔 동시 실행 수 제한
  operator:
    replicas: 1
    scanJobsConcurrentLimit: 3

  trivy:
    # Why: 매번 DB를 다운로드하면 네트워크 부담 → 내장 DB 사용
    offlineScan: false

    severity: "CRITICAL,HIGH"

    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 500m
        # Why: mysql-pxc(4컨테이너) 스캔 시 실측 502Mi → 1.5배 룰 적용 (64Mi 단위)
        memory: 768Mi

  # Why: 모든 namespace를 스캔하면 시스템 NS 노이즈 → 대상 제한
  # 빈 값이면 전체 스캔, 필요시 아래 주석 해제하여 제한
  # targetNamespaces: "blog-system"

  trivyOperator:
    # Why: kube-bench가 이미 CIS 벤치마크 담당 → 기능 중복 + node-collector는 root 실행으로 Kyverno require-non-root 위반
    clusterComplianceEnabled: false

    # Why: CP 노드에 NoSchedule taint 존재 → scan job이 스케줄링 불가
    #      chart 내부 변수명이 .Values.trivyOperator.scanJobTolerations → ConfigMap의 scanJob.tolerations 키로 변환됨
    scanJobTolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  serviceMonitor:
    # Why: Prometheus가 메트릭 수집하여 Grafana에서 CVE 현황 확인 가능
    enabled: true
