# ==============================================================================
# Wazuh Helm Wrapper Chart
# ==============================================================================
# 목적: Upstream Wazuh Chart를 Wrapper로 관리 (Helm Overlay 패턴)
# 버전: 4.7.0 (안정 버전)
# 포함 컴포넌트:
#   - Wazuh Manager (SIEM 분석 엔진)
#   - Wazuh Indexer (OpenSearch 기반 로그 저장소)
#   - Wazuh Dashboard (Kibana 기반 시각화)
# ==============================================================================
apiVersion: v2
name: my-wazuh
version: 1.0.0
description: Wrapper chart for Wazuh SIEM

# Helm dependency 정의
# Why: Upstream Chart를 직접 수정하지 않고 values.yaml로 커스터마이징
dependencies:
  - name: wazuh
    version: 4.7.0  # Why: 안정 버전 고정 (업그레이드 시 명시적으로 변경)
    repository: https://wazuh.github.io/wazuh-kubernetes
