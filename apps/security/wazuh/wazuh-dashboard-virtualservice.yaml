# ==============================================================================
# Wazuh Dashboard VirtualService
# ==============================================================================
# Purpose: Istio Ingress Gateway를 통한 Wazuh Dashboard 외부 접근
# Architecture:
#   Windows (192.168.1.195) → MetalLB (192.168.1.200)
#   → Istio Gateway (blog-system/blog-gateway)
#   → VirtualService (wazuh.jiminhome.shop)
#   → Wazuh Dashboard Service (dashboard.security:443)
#
# Why VirtualService:
#   - TLS 암호화
#   - AuthorizationPolicy 적용 가능 (192.168.1.0/24 제한)
#   - Istio Metrics 수집
#   - 아키텍처 표준 준수
#
# Dependencies:
#   - Gateway: blog-system/blog-gateway
#   - Service: dashboard.security (LoadBalancer 192.168.1.203)
#   - Windows hosts: 192.168.1.200 wazuh.jiminhome.shop
# ==============================================================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: wazuh-dashboard-routes
  namespace: security
  labels:
    app: wazuh-dashboard
spec:
  # Why: blog-system/blog-gateway 사용 (홈랩 표준, 다른 서비스와 동일)
  gateways:
    - blog-system/blog-gateway

  # Why: Windows hosts 파일에 등록된 도메인
  hosts:
    - wazuh.jiminhome.shop

  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            # Why: Wazuh Dashboard Service DNS (HTTPS 포트 443)
            host: dashboard.security.svc.cluster.local
            port:
              number: 443
      # Why: Dashboard 로딩 시간 여유
      timeout: 30s
