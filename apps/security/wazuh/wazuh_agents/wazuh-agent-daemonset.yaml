# ==============================================================================
# Wazuh Agent DaemonSet
# ==============================================================================
# Purpose: Cloud Native Pull pattern for Falco → Wazuh SIEM integration
# Architecture:
#   Falco Pod → stdout (JSON) → /var/log/containers/falco-*.log
#   → Wazuh Agent DaemonSet (tail) → Wazuh Manager (port 1514, TLS)
#
# Why DaemonSet:
#   - 각 노드의 로컬 로그 파일 접근 필요 (/var/log/containers)
#   - 모든 노드에서 Falco 이벤트 수집
#   - 로컬 버퍼링으로 안정성 향상 (네트워크 장애 시 재시도)
#
# Dependencies:
#   - Wazuh Manager StatefulSet (wazuh-manager-master-0)
#   - Sealed Secret: wazuh-authd-pass (Agent 등록 비밀번호)
#   - ConfigMap: wazuh-agent-conf (ossec.conf)
# ==============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: security
  labels:
    app: wazuh-agent
spec:
  selector:
    matchLabels:
      app: wazuh-agent
  template:
    metadata:
      labels:
        app: wazuh-agent
    spec:
      # Why: Control Plane 노드에도 배포 (모든 노드의 Falco 이벤트 수집)
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists

      # Why: 호스트 네트워크 사용 (노드 로그 파일 접근)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.2

          # Why: Wazuh Manager 연결 정보
          env:
            - name: WAZUH_MANAGER
              value: "wazuh-manager-master-0.wazuh-cluster.security.svc.cluster.local"

            # Why: Agent 자동 등록 (authd 프로토콜)
            - name: WAZUH_REGISTRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-authd-pass
                  key: authd.pass

            # Why: Manager 등록 주소 (enrollment)
            - name: WAZUH_REGISTRATION_SERVER
              value: "wazuh-manager-master-0.wazuh-cluster.security.svc.cluster.local"

            # Why: Agent 식별 (Kubernetes Node 이름 사용)
            - name: WAZUH_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # Why: 호스트 파일 시스템 접근 권한 필요
          securityContext:
            privileged: true

          volumeMounts:
            # Why: Kubernetes 컨테이너 로그 접근 (/var/log/containers/falco-*.log)
            - name: varlog
              mountPath: /var/log
              readOnly: true

            # Why: Docker 컨테이너 로그 메타데이터 접근 (심볼릭 링크 해석)
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

            # Why: Wazuh Agent 설정 (Falco 로그 tail 설정 포함)
            - name: wazuh-agent-config
              mountPath: /var/ossec/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true

            # Why: firewall-drop Active Response가 iptables를 실행해야 하는데
            # 컨테이너 이미지에 iptables가 없음 → 호스트 /usr/sbin을 마운트
            # Wazuh Agent의 주요 바이너리는 /var/ossec/에 있어 이 마운트가 영향 없음
            - name: host-usr-sbin
              mountPath: /usr/sbin
              readOnly: true

            # Why: Ubuntu 22.04의 iptables는 심볼릭 링크 체인 사용
            # /usr/sbin/iptables → /etc/alternatives/iptables → /usr/sbin/iptables-nft
            # 이 체인이 컨테이너 내에서 해석되려면 /etc/alternatives도 마운트 필요
            - name: host-etc-alternatives
              mountPath: /etc/alternatives
              readOnly: true

          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

      volumes:
        # Why: 호스트의 /var/log (모든 컨테이너 로그)
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        # Why: 호스트의 Docker 컨테이너 디렉터리
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

        # Why: ConfigMap에서 ossec.conf 주입
        - name: wazuh-agent-config
          configMap:
            name: wazuh-agent-conf

        # Why: 호스트 /usr/sbin 마운트 (firewall-drop Active Response용 iptables)
        - name: host-usr-sbin
          hostPath:
            path: /usr/sbin
            type: Directory

        # Why: Ubuntu alternatives 심볼릭 링크 체인 해결
        # iptables → /etc/alternatives/iptables → iptables-nft 체인 작동
        - name: host-etc-alternatives
          hostPath:
            path: /etc/alternatives
            type: Directory
