<!--
  Wazuh Agent - Configuration for Kubernetes DaemonSet
  Purpose: Tail Falco container logs and forward to Wazuh Manager
  Architecture: Cloud Native Pull pattern (Agent tails /var/log/containers)
-->
<ossec_config>
  <!-- Manager connection -->
  <client>
    <server>
      <!-- Why: MetalLB LoadBalancer IP 사용 (hostNetwork Pod에서 ClusterIP DNS 조회 불가)
           wazuh-workers Service → Worker 노드들로 라우팅 (1514/TCP) -->
      <address>192.168.1.202</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <!-- Why: 이미 등록된 에이전트이므로 enrollment 비활성화
         client.keys에 저장된 인증 정보로 재연결
         (enrollment 포트 1515는 MetalLB 미노출) -->
    <enrollment>
      <enabled>no</enabled>
    </enrollment>

    <!-- Why: Agent 식별 (Kubernetes Node 이름 사용) -->
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- Falco 로그 수집 -->
  <localfile>
    <!-- Why: Docker/Containerd 로그 형식 지원 (timestamp + stdout + JSON) -->
    <log_format>syslog</log_format>
    <location>/var/log/containers/falco-*.log</location>
  </localfile>

  <!-- Why: SSH 로그 수집 (Brute Force 공격 탐지) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Why: 시스템 로그 수집 (전체 시스템 이벤트) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Why: 파일 무결성 모니터링 (중요 파일 변경 탐지) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <directories check_all="yes" realtime="no">/etc</directories>
    <directories check_all="yes" realtime="no">/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" realtime="no">/bin,/sbin</directories>
  </syscheck>

  <!-- Why: Rootkit 탐지 -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- Why: 시스템 정보 수집 (프로세스, 네트워크, 패키지 등) -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
  </wodle>

  <!-- Logging -->
  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
