<!--
  Wazuh Agent - Configuration for Kubernetes DaemonSet
  Purpose: Tail Falco container logs and forward to Wazuh Manager
  Architecture: Cloud Native Pull pattern (Agent tails /var/log/containers)
-->
<ossec_config>
  <!-- Manager connection -->
  <client>
    <server>
      <!-- Why: Wazuh Manager Master StatefulSet DNS -->
      <address>wazuh-manager-master-0.wazuh-cluster.security.svc.cluster.local</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <!-- Why: Auto-enrollment via WAZUH_REGISTRATION_PASSWORD env var -->
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager-master-0.wazuh-cluster.security.svc.cluster.local</manager_address>
    </enrollment>

    <!-- Why: Agent 식별 (Kubernetes Node 이름 사용) -->
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- Falco 로그 수집 -->
  <localfile>
    <!-- Why: Falco JSON 이벤트를 Wazuh로 전송 -->
    <log_format>json</log_format>
    <location>/var/log/containers/falco-*.log</location>
  </localfile>

  <!-- Logging -->
  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
