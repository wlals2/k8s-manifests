apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Why: security namespace 사용 (홈랩 표준)
namespace: security

secretGenerator:
  - name: indexer-certs
    files:
      - certs/indexer_cluster/root-ca.pem
      - certs/indexer_cluster/node.pem
      - certs/indexer_cluster/node-key.pem
      - certs/indexer_cluster/dashboard.pem
      - certs/indexer_cluster/dashboard-key.pem
      - certs/indexer_cluster/admin.pem
      - certs/indexer_cluster/admin-key.pem
      - certs/indexer_cluster/filebeat.pem
      - certs/indexer_cluster/filebeat-key.pem
  - name: dashboard-certs
    files:
      - certs/dashboard_http/cert.pem
      - certs/dashboard_http/key.pem
      - certs/indexer_cluster/root-ca.pem

configMapGenerator:
  - name: indexer-conf
    files:
      - indexer_stack/wazuh-indexer/indexer_conf/opensearch.yml
      - indexer_stack/wazuh-indexer/indexer_conf/internal_users.yml
  - name: wazuh-conf
    files:
      - wazuh_managers/wazuh_conf/master.conf
      - wazuh_managers/wazuh_conf/worker.conf
  - name: dashboard-conf
    files:
      - indexer_stack/wazuh-dashboard/dashboard_conf/opensearch_dashboards.yml
  # Why: Wazuh Agent DaemonSet 설정 (Falco 로그 tail)
  - name: wazuh-agent-conf
    files:
      - wazuh_agents/wazuh-agent-conf/ossec.conf
  # Why: Level 10+ 보안 이벤트를 Discord로 전송하는 커스텀 Integration 스크립트
  - name: wazuh-discord-integration
    files:
      - wazuh_managers/integrations/custom-discord
      - wazuh_managers/integrations/custom-discord.py
  # Why: Falco → MITRE ATT&CK 분류 + 에스컬레이션 룰 (frequency+timeframe)
  #      InitContainer가 Pod 시작 시 PVC의 /var/ossec/etc/rules/에 복사
  - name: wazuh-falco-rules
    files:
      - wazuh_managers/wazuh_conf/wazuh-falco-rules.xml
  # Why: 컨테이너 로그 prefix 제거 후 Falco JSON 파싱 (기본 JSON 디코더 미작동)
  #      InitContainer가 Pod 시작 시 PVC의 /var/ossec/etc/decoders/에 복사
  - name: wazuh-falco-decoder
    files:
      - wazuh_managers/wazuh_conf/wazuh-falco-decoder.xml

resources:
  - base/wazuh-ns.yaml
  - base/storage-class.yaml

  # Why: Sealed Secrets 사용 (보안 강화 - base64가 아닌 공개키 암호화)
  - sealed-secrets/wazuh-api-cred-sealedsecret.yaml
  - sealed-secrets/wazuh-authd-pass-sealedsecret.yaml
  - sealed-secrets/wazuh-cluster-key-sealedsecret.yaml
  - sealed-secrets/dashboard-cred-sealedsecret.yaml
  - sealed-secrets/indexer-cred-sealedsecret.yaml

  - wazuh_managers/wazuh-cluster-svc.yaml
  - wazuh_managers/wazuh-master-svc.yaml
  - wazuh_managers/wazuh-workers-svc.yaml
  - wazuh_managers/wazuh-master-sts.yaml
  - wazuh_managers/wazuh-worker-sts.yaml

  - indexer_stack/wazuh-indexer/indexer-svc.yaml
  - indexer_stack/wazuh-indexer/cluster/indexer-api-svc.yaml
  - indexer_stack/wazuh-indexer/cluster/indexer-sts.yaml

  - indexer_stack/wazuh-dashboard/dashboard-svc.yaml
  - indexer_stack/wazuh-dashboard/dashboard-deploy.yaml

  # Why: Istio VirtualService for external access via wazuh.jiminhome.shop
  - wazuh-dashboard-virtualservice.yaml

  # Why: Wazuh Agent DaemonSet (Cloud Native Pull pattern for Falco integration)
  - wazuh_agents/wazuh-agent-daemonset.yaml
