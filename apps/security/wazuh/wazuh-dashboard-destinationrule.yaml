# ==============================================================================
# Wazuh Dashboard DestinationRule - TLS Origination
# ==============================================================================
# Purpose: Envoy가 Dashboard Pod (5601)에 HTTPS로 연결하도록 설정
#
# Why TLS Origination:
#   - Dashboard Pod는 5601에서 HTTPS만 listen
#   - Service port 80 → targetPort 5601로 매핑
#   - Envoy가 기본적으로 HTTP로 연결 시도
#   - DestinationRule이 Envoy에게 "HTTPS로 연결하라"고 지시
#
# Architecture:
#   Gateway HTTP (80) → VirtualService → Service port 80
#   → Envoy (TLS Origination 적용)
#   → Dashboard Pod 5601 (HTTPS)
#
# Dependencies:
#   - VirtualService: wazuh-dashboard-routes
#   - Service: dashboard.security (port 80)
# ==============================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: wazuh-dashboard-tls-origination
  namespace: security
  labels:
    app: wazuh-dashboard
spec:
  host: dashboard.security.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 80  # Why: Service port 80으로 들어오는 트래픽에 적용
        tls:
          mode: SIMPLE  # Why: Backend (5601)에 HTTPS로 연결, 인증서 검증 안 함
          # sni: dashboard.security.svc.cluster.local  # Optional: SNI 명시
