# ==============================================================================
# Wazuh SIEM Values (홈랩 환경 최적화)
# ==============================================================================
# Why: k8s-worker3 용량 제약 (38.6GB)에 맞게 Indexer Disk 축소
#
# 커스터마이징 항목:
# - Indexer Storage: 50Gi → 15Gi
# - Single-node 방식 (Manager 1개, Indexer 1개, Dashboard 1개)
# - security namespace에 배포
#
# Helm Wrapper 형식:
# - dependency 이름이 "wazuh"이므로 wazuh: prefix 필수!
# ==============================================================================

# Why: Helm dependency 이름이 "wazuh"이므로 prefix 사용
wazuh:
  # Why: Wazuh Indexer (Elasticsearch 기반) 설정
  indexer:
    # Why: Single-node 방식 (HA 불필요, 홈랩 환경)
    replicas: 1

    # Why: k8s-worker3 용량 제약 (38.6GB < 50GB)
    storageClass: "longhorn"
    storageSize: 15Gi

    # Why: 홈랩 환경이므로 리소스 최소화
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Why: Wazuh Dashboard (Kibana 기반 웹 UI)
  dashboard:
    # Why: Single-node 방식
    replicas: 1

    # Why: 홈랩 환경이므로 리소스 최소화
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

  # Why: Wazuh Manager (로그 수집 + 분석 엔진)
  # Note: Helm Chart에서 "wazuh.master", "wazuh.worker" 구조 사용
  wazuh:
    master:
      # Why: k8s-worker3 용량 제약
      storageClass: "longhorn"
      storageSize: 15Gi

      # Why: 홈랩 환경이므로 리소스 최소화
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

      # Why: Falco 이벤트 수신을 위한 Syslog 입력 추가
      # Note: extraConf는 기본 ossec.conf에 병합됨 (기존 Agent 연결 유지)
      # Note: 515 포트 사용 (1514는 Agent 전용, 514는 root 권한 필요)
      extraConf: |
        <ossec_config>
          <remote>
            <connection>syslog</connection>
            <port>515</port>
            <protocol>tcp</protocol>
            <allowed-ips>10.0.0.0/8</allowed-ips>
          </remote>
        </ossec_config>

    worker:
      # Why: Single-node이므로 Worker 0개
      replicas: 0

      # Why: Worker 비활성화 시에도 storageSize 설정 필요
      storageClass: "longhorn"
      storageSize: 15Gi
