# ==============================================================================
# Wazuh SIEM Values (홈랩 환경 최적화)
# ==============================================================================
# Why: k8s-worker3 용량 제약 (38.6GB)에 맞게 Indexer Disk 축소
#
# 커스터마이징 항목:
# - Indexer Storage: 50Gi → 15Gi
# - Single-node 방식 (Manager 1개, Indexer 1개, Dashboard 1개)
# - security namespace에 배포
# ==============================================================================

# Why: Wazuh Indexer (Elasticsearch 기반) 설정
wazuh:
  indexer:
    # Why: Single-node 방식 (HA 불필요, 홈랩 환경)
    replicas: 1

    # Why: k8s-worker3 용량 제약 (38.6GB < 50GB)
    persistence:
      enabled: true
      storageClass: "longhorn"  # Why: Longhorn StorageClass 사용
      size: 15Gi  # Why: 50Gi → 15Gi 축소

    # Why: 홈랩 환경이므로 리소스 최소화
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

  # Why: Wazuh Manager (로그 수집 + 분석 엔진)
  manager:
    # Why: Single-node 방식
    replicas: 1

    # Why: 홈랩 환경이므로 리소스 최소화
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Why: Wazuh Dashboard (Kibana 기반 웹 UI)
  dashboard:
    # Why: Single-node 방식
    replicas: 1

    # Why: 홈랩 환경이므로 리소스 최소화
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
