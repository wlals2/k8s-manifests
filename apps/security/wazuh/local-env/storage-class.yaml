# Why: Longhorn StorageClass 사용 (기존 클러스터 표준)
# Note: wazuh-storage라는 이름으로 alias 생성 (Wazuh 매니페스트 호환성)

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: wazuh-storage
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
reclaimPolicy: Retain
allowVolumeExpansion: true
