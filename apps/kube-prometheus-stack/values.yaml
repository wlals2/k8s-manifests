# ==============================================================================
# Kube-Prometheus-Stack Values
# ==============================================================================
# 목적: Raw ConfigMap 대신 CRD 기반 모니터링 구현
# 변경 이유: ConfigMap은 runtime 수정으로 OutOfSync 지속 발생
# 해결책: ServiceMonitor/PrometheusRule CRD 사용 → Always Synced
# ==============================================================================
# CRITICAL: Wrapper Chart에서는 dependency name을 prefix로 사용해야 함!
# Chart.yaml의 dependencies.name: kube-prometheus-stack
# ==============================================================================

kube-prometheus-stack:
  # ==============================================================================
  # Global Settings
  # ==============================================================================
  global:
    # RBAC: Role-Based Access Control 활성화
    # 이유: Prometheus Operator가 CRD를 관리하려면 RBAC 필요
    # 영향: ServiceAccount, ClusterRole, ClusterRoleBinding 자동 생성
    rbac:
      create: true

  # ==============================================================================
  # Prometheus Operator
  # ==============================================================================
  # 역할: ServiceMonitor/PrometheusRule CRD를 감시하고 Prometheus 설정 자동 업데이트
  # 작동 원리:
  #   1. ServiceMonitor CRD 생성 → Operator가 감지
  #   2. Operator가 prometheus.yml에 scrape_configs 자동 추가
  #   3. Prometheus Pod 자동 reload (ConfigMap 수동 수정 불필요!)
  prometheusOperator:
    enabled: true

    # Operator가 관리할 namespace
    # 옵션:
    #   - [] (empty): 모든 namespace (기본값)
    #   - [monitoring, blog-system]: 특정 namespace만
    # 권장: 모든 namespace (유연성)
    namespaces: {}

    # Admission Webhook 비활성화
    # 이유: 홈랩 환경에서 불필요 (webhook 인증서 관리 복잡)
    # 영향: CRD 생성 시 validation 없음 (YAML 오류 주의!)
    admissionWebhooks:
      enabled: false

  # ==============================================================================
  # Prometheus
  # ==============================================================================
  # 역할: 메트릭 수집 및 저장
  prometheus:
    enabled: true

    # Prometheus 설정
    prometheusSpec:
      # ServiceMonitor 선택 규칙 (CRITICAL!)
      # 중요: ServiceMonitor에 "prometheus: kube-prometheus" 라벨 필수!
      # 이유: Helm Chart의 원래 표준 (Upstream Convention)
      # Platform Conformity: 플랫폼이 정한 표준 라벨링 규칙을 따름
      # 예시:
      #   apiVersion: monitoring.coreos.com/v1
      #   kind: ServiceMonitor
      #   metadata:
      #     labels:
      #       prometheus: kube-prometheus  ← 필수! (Helm Chart 기본값)
      serviceMonitorSelector:
        matchLabels:
          prometheus: kube-prometheus

      # PrometheusRule 선택 규칙 (CRITICAL!)
      # 중요: PrometheusRule에도 "prometheus: kube-prometheus" 라벨 필수!
      ruleSelector:
        matchLabels:
          prometheus: kube-prometheus

      # Probe 선택 규칙 (CRITICAL!)
      # 중요: Probe에도 "prometheus: kube-prometheus" 라벨 필수!
      # 이유: Helm Chart의 원래 표준 (Upstream Convention)
      # Platform Conformity: 플랫폼이 정한 표준 라벨링 규칙을 따름
      # 기본값: probeSelectorNilUsesHelmValues=true로 인해 release: 라벨 사용
      # 변경: prometheus: kube-prometheus (Upstream 표준 명시)
      # 예시:
      #   apiVersion: monitoring.coreos.com/v1
      #   kind: Probe
      #   metadata:
      #     labels:
      #       prometheus: kube-prometheus  ← 필수! (Helm Chart 권장 표준)
      probeSelector:
        matchLabels:
          prometheus: kube-prometheus

      # 메트릭 보관 기간
      # 형식: Nd (N일), Nh (N시간)
      # Why: 30d SLO 계산을 위해 30일치 데이터 필요 (7d → 30d로 변경)
      # PVC 여유: 현재 2.5G/20G (13%) → 30d 예상 ~11G (55%) 충분
      retention: 30d

      # 메트릭 쿼리 시간 제한
      # 이유: 복잡한 PromQL 쿼리로 인한 OOM 방지
      # 권장: 10m (10분)
      retentionSize: ""

      # Storage 설정 (PVC)
      # 이유: Pod 재시작 시 메트릭 보존
      # 주의: StorageClass가 없으면 Pending 상태
      storageSpec:
        volumeClaimTemplate:
          spec:
            # StorageClass 지정 (선택 사항)
            # 옵션: 필드 생략 (기본 SC 자동 사용), longhorn, nfs-client 등
            # 권장: 필드 생략 (cluster 기본 SC 사용)
            # 현재: longhorn (default) 자동 사용

            # 액세스 모드
            # ReadWriteOnce: 단일 Node만 마운트 (권장)
            # ReadWriteMany: 여러 Node 마운트 (NFS 필요)
            accessModes:
              - ReadWriteOnce

            # 스토리지 용량
            # 계산: 약 357MB/day (실측: 7d = 2.5G)
            # 30d retention → ~11GB + 여유분 = 20GB 충분 (55% 예상)
            resources:
              requests:
                storage: 40Gi

      # Why: Tempo metrics_generator가 span metrics를 remote_write로 push하기 위해 필요
      #      이 설정 없으면 Prometheus가 /api/v1/write 엔드포인트를 열지 않음
      enableRemoteWriteReceiver: true

      # 리소스 제한
      # 이유: OOM Killer 방지, 다른 Pod 영향 최소화
      # 권장: 홈랩 환경 기준
      resources:
        requests:
          cpu: 1000m     # 실측(18m) 기준이나 쿼리 피크 대비 여유 확보
          memory: 4Gi    # 실측(624Mi) × 2배 + 여유 (대규모 쿼리 시 급증)
        limits:
          cpu: 3000m     # 피크 시 3 core까지 허용
          memory: 6Gi    # OOM Killer 방지 상한선

  # ==============================================================================
  # Grafana
  # ==============================================================================
  # 역할: 메트릭 시각화 대시보드
  grafana:
    enabled: true

    # Why: kube-prometheus-stack 기본 대시보드 비활성화 (우리가 만든 대시보드만 사용)
    defaultDashboardsEnabled: false

    # Admin 비밀번호 (변경 권장!)
    # 주의: 평문 저장 (SealedSecret으로 관리 권장)
    # TODO: grafana-admin-sealedsecret.yaml로 교체
    adminPassword: admin

    # Sidecar 설정 (자동 Dashboard 로드)
    # 작동 원리:
    #   1. ConfigMap에 "grafana_dashboard: \"1\"" 라벨 추가
    #   2. Sidecar가 자동 감지하여 Grafana에 로드
    #   3. ConfigMap 수정 → 자동 reload (수동 import 불필요!)
    sidecar:
      dashboards:
        enabled: true

        # Dashboard 자동 로드 라벨
        # 중요: ConfigMap에 이 라벨 필수!
        # 예시:
        #   apiVersion: v1
        #   kind: ConfigMap
        #   metadata:
        #     labels:
        #       grafana_dashboard: "1"  ← 필수!
        label: grafana_dashboard

        # 라벨 값 (기본: "1")
        # 옵션: "1", "true", "enabled" 등 (문자열 필수!)
        labelValue: "1"

        # 검색할 namespace
        # 옵션:
        #   - null: 모든 namespace (기본값)
        #   - monitoring: monitoring namespace만
        # 권장: null (유연성)
        searchNamespace: null

      # Datasource 자동 로드 (선택 사항)
      # 이유: Prometheus는 이미 자동 등록됨
      datasources:
        enabled: true

    # Why: Tempo datasource 등록 - Trace 시각화, Logs/Metrics 3축 연계
    additionalDataSources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        isDefault: false
        jsonData:
          nodeGraphEnabled: true
          tracesToLogsV2:
            enabled: true
            datasourceUid: P8E80F9AEF21F6940
            filterByTraceID: true
            filterBySpanID: true
          tracesToMetricsV2:
            enabled: true
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          lokiSearch:
            datasourceUid: P8E80F9AEF21F6940

    # Persistent Storage (선택 사항)
    # 이유: Dashboard 설정 보존 (Sidecar 사용 시 불필요)
    # 권장: 비활성화 (ConfigMap으로 관리)
    persistence:
      enabled: false

    # Why: Daily Report 대시보드를 PNG로 캡처 → Discord 이미지 전송
    #      Chromium 기반이므로 Grafana Pod과 분리 배포 (OOM 방지)
    imageRenderer:
      enabled: true
      replicas: 1
      image:
        repository: grafana/grafana-image-renderer
        tag: latest
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        BROWSER_TZ: Asia/Seoul
      networkPolicy:
        limitIngress: false
        limitEgress: false

    # Why: Image Renderer Service URL을 Grafana에 알려줘야 /render API 작동
    grafana.ini:
      rendering:
        server_url: http://kube-prometheus-stack-grafana-image-renderer:8081/render
        callback_url: http://kube-prometheus-stack-grafana:80/

  # ==============================================================================
  # AlertManager
  # ==============================================================================
  # 역할: Alert 알림 전송 (Telegram, Slack, Email 등)
  alertmanager:
    enabled: true

    # Why: AlertManager → Discord 알림 연동
    # 핵심: Discord /slack 엔드포인트 사용 → slack_configs로 보내면 Discord가 이해
    #       webhook_configs는 Discord 미호환 (AlertManager JSON ≠ Discord JSON)
    config:
      global:
        resolve_timeout: 5m
      route:
        # Why: instance 추가 → 동일 알람이 여러 노드에서 발화할 때 노드별로 분리
        group_by: ['alertname', 'namespace', 'severity', 'instance']
        group_wait: 30s
        group_interval: 30s
        repeat_interval: 4h
        receiver: 'discord-homelab'
        routes:
          - match:
              severity: critical
            receiver: 'discord-critical'
          - match:
              severity: warning
            receiver: 'discord-warning'
          - match:
              alertname: Watchdog
            receiver: 'null'
      receivers:
        - name: 'null'
        # Why: severity별 분리하면 나중에 채널 분리 가능 (현재는 같은 webhook)
        - name: 'discord-homelab'
          slack_configs:
            - api_url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-/slack'
              send_resolved: true
              color: '{{ if eq .Status "firing" }}#FF4444{{ else }}#36D399{{ end }}'
              title: '{{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
              text: '{{ range .Alerts }}**{{ .Labels.severity }}** - {{ .Annotations.summary }}
{{ end }}'
        - name: 'discord-critical'
          slack_configs:
            - api_url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-/slack'
              send_resolved: true
              # Why: #FF4444=빨강(firing), #36D399=초록(resolved) → Discord 임베드 좌측 색상 바
              color: '{{ if eq .Status "firing" }}#FF4444{{ else }}#36D399{{ end }}'
              title: '{{ if eq .Status "firing" }}🔴 CRITICAL{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
              text: '{{ range .Alerts }}{{ .Annotations.summary }}
{{ end }}'
        - name: 'discord-warning'
          slack_configs:
            - api_url: 'https://discordapp.com/api/webhooks/1467150664336408668/L8uFfxn5O8WXLpt99Q1oeWmhp6H9ae8OOb0oUMzmWojIGDuufs-zDbZ2JnrSE7Mm9Ya-/slack'
              send_resolved: true
              # Why: #FFAA00=노랑(warning firing), #36D399=초록(resolved)
              color: '{{ if eq .Status "firing" }}#FFAA00{{ else }}#36D399{{ end }}'
              title: '{{ if eq .Status "firing" }}⚠️ WARNING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
              text: '{{ range .Alerts }}{{ .Annotations.summary }}
{{ end }}'
      inhibit_rules:
        # Why: Critical 발생 시 같은 alertname의 Warning 억제 → 중복 알림 방지
        - source_match:
            severity: 'critical'
          target_match:
            severity: 'warning'
          equal: ['alertname', 'namespace']

    # AlertManager 설정
    alertmanagerSpec:
      # Storage 설정 (선택 사항)
      # 이유: Alert 이력 보존 (Silences, Inhibit Rules)
      # 권장: 홈랩 환경에서는 비활성화 (휘발성 데이터)
      storage: {}

      # 리소스 제한
      # Why: 실제 사용량 ~33Mi 기반 조정 (기존 128Mi는 4배 과다 예약)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  # ==============================================================================
  # Exporters (Node Exporter, Kube-State-Metrics)
  # ==============================================================================

  # Node Exporter 활성화
  # Why: 노드 디스크/CPU/메모리 메트릭 수집 (node_filesystem_*, node_cpu_*, node_memory_*)
  # 필요성: NodeDiskHigh/NodeDiskCritical Alert 작동에 필수
  nodeExporter:
    enabled: true

  # Subchart: prometheus-node-exporter
  # Why: ServiceMonitor에 prometheus label 추가 (Platform Conformity)
  prometheus-node-exporter:
    prometheus:
      monitor:
        enabled: true
        # Why: Prometheus가 ServiceMonitor를 인식하도록 label 추가 (serviceMonitorSelector 일치)
        additionalLabels:
          prometheus: kube-prometheus

  # Kube-State-Metrics 활성화
  # 역할: Kubernetes 리소스 상태 메트릭 (Deployment, Pod, Node 등)
  # 필수: Kubernetes 클러스터 모니터링에 필수
  kubeStateMetrics:
    enabled: true

  # Subchart: kube-state-metrics
  # Why: ServiceMonitor에 prometheus label 추가
  kube-state-metrics:
    prometheus:
      monitor:
        enabled: true
        additionalLabels:
          prometheus: kube-prometheus

  # ==============================================================================
  # Default Rules (Alert Rules)
  # ==============================================================================
  # 이유: Upstream 기본 Alert Rules 포함 (Node, Pod, etcd 등)
  # 옵션:
  #   - true: 기본 Rules 사용 (권장 - 학습용)
  #   - false: 커스텀 PrometheusRule만 사용
  # 권장: true (나중에 false로 변경 가능)
  defaultRules:
    create: true

    # 기본 Rules 라벨
    # 이유: Prometheus가 Rules를 인식하려면 라벨 필요
    rules:
      alertmanager: true
      etcd: true
      general: true
      k8s: true
      kubeApiserver: true
      kubePrometheusNodeRecording: true
      kubernetesSystem: true
      node: true
      prometheus: true

# ==============================================================================
# 주의사항 및 다음 단계
# ==============================================================================
# ⚠️ 주의사항:
#   1. ServiceMonitor/PrometheusRule에 "prometheus: kube-prometheus" 라벨 필수!
#   2. Grafana Dashboard ConfigMap에 "grafana_dashboard: \"1\"" 라벨 필수!
#   3. adminPassword는 SealedSecret으로 교체 권장
#
# 📝 다음 단계:
#   1. ServiceMonitor 생성 (configs/monitoring/servicemonitors/)
#   2. PrometheusRule 생성 (configs/monitoring/prometheusrules/)
#   3. Grafana Dashboard ConfigMap 라벨 추가
#   4. ArgoCD Application 생성 (argocd/kube-prometheus-stack-app.yaml)
#   5. 기존 Raw ConfigMap 제거 (prometheus-config.yaml, prometheus-alert-rules.yaml)
#
# 🔍 검증 명령어:
#   # Operator Pod 확인
#   kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus-operator
#
#   # ServiceMonitor 인식 확인
#   kubectl get servicemonitor -n monitoring
#
#   # PrometheusRule 인식 확인
#   kubectl get prometheusrule -n monitoring
#
#   # Prometheus 설정 확인 (자동 생성된 prometheus.yml)
#   kubectl exec -n monitoring prometheus-kube-prometheus-stack-prometheus-0 \
#     -- cat /etc/prometheus/config_out/prometheus.env.yaml
# ==============================================================================

