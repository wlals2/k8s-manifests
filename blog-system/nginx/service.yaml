# ==============================================================================
# hugo-blog Service
# ==============================================================================
# 목적: hugo-blog Pod 클러스터 내부 노출
# 의존성: nginx/deployment.yaml (app=hugo-blog)
# ==============================================================================
# Type: ClusterIP — 외부 노출은 향후 Ingress 또는 LoadBalancer로 별도 처리
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: hugo-blog
  namespace: blog-system
  labels:
    app: hugo-blog
spec:
  # Why: MetalLB 설치 전 임시 NodePort로 외부 접근 허용.
  #      MetalLB 설치 후 LoadBalancer로 교체 예정.
  type: NodePort
  selector:
    app: hugo-blog
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
